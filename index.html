    const s = d.id ? (await API.get('/sessions/' + d.id)).session : null;
    const course = s ? s.course : (await API.get('/courses/' + d.course)).course;
    const cfg = App.state.config;
    const start = s ? s.starts_at : (() => { const t = new Date(Date.now() + 86400000); t.setHours(19, 0, 0, 0); return t.toISOString(); })();
    const prov = s ? s.provider : (course.default_provider || cfg.default_provider);
    const durs = [30, 40, 50, 60, 80, 90, 120];
    const dur = s ? s.duration_min : (course.kind === 'group' ? 80 : 50);
    modal({
      title: s ? '회차 수정' : '회차 추가',
      body: html`<form class="form" id="sess-form" data-form="sess.save" novalidate>
        <input type="hidden" name="id" value="${s ? s.id : ''}"><input type="hidden" name="course" value="${course.id}">
        ${field('제목', html`<input id="sf-title" name="title" value="${s ? s.title : ''}" maxlength="80" placeholder="비워 두면 회차 번호가 붙습니다">`)}
        <div class="grid2">
          ${field('시작', html`<input id="sf-start" name="starts_at" type="datetime-local" value="${fmt.local(start)}" required>`)}
          ${field('수업 시간', html`<select id="sf-dur" name="duration_min">${(durs.indexOf(dur) < 0 ? durs.concat(dur).sort((a, b) => a - b) : durs).map((m) => opt(m, fmt.mins(m), dur))}</select>`)}
          ${field('화상 방식', html`<select id="sf-prov" name="provider" data-change="sess.prov">${['builtin', 'jitsi', 'link'].map((p) => opt(p, LABEL.provider[p], prov))}</select>`)}
          ${s ? '' : field('반복', html`<select id="sf-rep" name="repeat">${opt(1, '반복 없음', 1)}${[2, 3, 4, 6, 8, 10, 12].map((n) => opt(n, '매주 · ' + n + '회', 1))}</select>`)}
        </div>
        <div id="sf-url"${prov === 'link' ? '' : raw(' hidden')}>${field('외부 화상회의 주소', html`<input id="sf-ext" name="external_url" type="url" value="${s ? s.external_url : ''}" placeholder="https://zoom.us/j/...">`, 'Zoom, Google Meet 등의 회의 주소를 붙여 넣습니다.')}</div>
        <p class="hint" id="sf-hint">${provHint(prov, course)}</p>
      </form>`,
      foot: html`${s ? html`<button class="btn btn-danger-ghost" type="button" data-act="sess.delete" data-id="${s.id}" data-course="${course.id}">삭제</button>${s.status === 'scheduled' ? html`<button class="btn" type="button" data-act="sess.cancel" data-id="${s.id}">수업 취소</button>` : s.status === 'canceled' ? html`<button class="btn" type="button" data-act="sess.restore" data-id="${s.id}">취소 되돌리기</button>` : ''}` : ''}<span class="grow"></span><button class="btn" type="button" data-act="layer.close">닫기</button><button class="btn btn-primary" type="submit" form="sess-form">${s ? '저장' : '등록'}</button>`
    });
  });
  function provHint(p, course) {
    if (p === 'builtin') return '이 화면 안에서 바로 연결됩니다. ' + (course.room_mode === 'lecture' ? '강의형이라 학생은 컨설턴트 화면만 봅니다.' : '토론형은 6명 이하에 맞습니다. 더 큰 수업은 Jitsi나 외부 링크를 쓰세요.');
    if (p === 'jitsi') return 'Jitsi 회의실이 이 화면 안에 열립니다. 인원이 많은 그룹 수업에 맞습니다.';
    return '입장 버튼을 누르면 새 탭에서 회의가 열립니다. 출석은 버튼을 누른 시각으로 기록됩니다.';
  }
  on('sess.prov', (d, el) => { $('#sf-url').hidden = el.value !== 'link'; $('#sf-hint').textContent = provHint(el.value, { room_mode: '' }); });
  on('sess.save', async (f) => {
    const body = { title: f.title, starts_at: new Date(f.starts_at).toISOString(), duration_min: f.duration_min, provider: f.provider, external_url: f.external_url || '' };
    if (!f.id) body.repeat = f.repeat;
    const send = (extra) => (f.id ? API.patch('/sessions/' + f.id, Object.assign(body, extra)) : API.post('/courses/' + f.course + '/sessions', Object.assign(body, extra)));
    try { await send({}); } catch (e) {
      if (e.status !== 409) throw e;
      const list = (e.body.conflicts || []).map((c) => fmt.when(c.starts_at) + ' ' + c.course_title + ' · ' + c.title).join(' / ');
      if (!(await ask({ title: '시간이 겹칩니다', message: '같은 시간에 이미 수업이 있습니다.', detail: list, yes: '그래도 등록' }))) return;
      await send({ force: 1 });
    }
    App.closeLayers(); toast(f.id ? '회차를 저장했습니다.' : '회차를 등록했습니다.'); App.refresh();
  });
  on('sess.delete', async (d) => {
    if (!(await ask({ title: '회차 삭제', message: '이 회차를 삭제할까요?', detail: '출석 기록이 함께 지워지며 되돌릴 수 없습니다. 일정만 없애려면 "수업 취소"를 쓰세요.', yes: '삭제', danger: true }))) return;
    await API.del('/sessions/' + d.id);
    App.closeLayers(); toast('회차를 삭제했습니다.');
    if (/^\/sessions\//.test(App.state.route.path)) App.go('/courses/' + d.course, true); else App.refresh();
  });
  on('sess.cancel', async (d) => {
    if (!(await ask({ title: '수업 취소', message: '이 수업을 취소할까요?', detail: '학생 일정에 "취소"로 표시됩니다. 나중에 되돌릴 수 있습니다.', yes: '수업 취소', danger: true }))) return;
    await API.patch('/sessions/' + d.id, { status: 'canceled' });
    App.closeLayers(); toast('수업을 취소했습니다.'); App.refresh();
  });
  on('sess.restore', async (d) => { await API.patch('/sessions/' + d.id, { status: 'scheduled' }); App.closeLayers(); toast('수업을 다시 예정으로 돌렸습니다.'); App.refresh(); });

  // ---------------------------------------------------------------- 회차 상세
  App.route('/sessions/:id', async (ctx) => {
    const r = await API.get('/sessions/' + ctx.params.id);
    if (!ctx.alive()) return;
    const s = r.session, staff = isStaff();
    App.header({
      title: s.title, back: '/courses/' + s.course_id, sub: s.course.title,
      actions: s.can_manage ? html`<button class="btn" type="button" data-act="sess.form" data-id="${s.id}">${icon('edit', 16)}<span class="hide-sm">회차 수정</span></button>` : ''
    });
    const my = r.my_attendance;
    const recOpt = { none: '녹화가 없습니다. 수업 중 강의실 아래쪽의 "녹화"를 누르면 수업이 끝난 뒤 여기에 올라옵니다.' };
    const showRecs = r.recordings.length > 0 || (s.can_manage && s.provider === 'builtin' && App.state.config.record && App.state.config.record.on);
    setHTML(ctx.el, html`<div class="view-in">
      <section class="shead c-${s.course.color}">
        <div class="shead-l">
          <p class="shead-d">${fmt.date(s.starts_at)}<b>${fmt.range(s)}</b></p>
          <p class="shead-m">${statusChip(s)}<span>${icon(provIcon(s.provider), 14)}${LABEL.provider[s.provider]}</span><span>${icon('user', 14)}${s.consultant ? s.consultant.name : ''}</span><span>${icon('clock', 14)}${fmt.mins(s.duration_min)}</span></p>
        </div>
        <div class="shead-r">
          ${!staff && my ? html`<span class="meta">내 출석 ${attChip(my.status)}${my.seconds ? ' ' + fmt.secs(my.seconds) : ''}</span>` : ''}
          ${!s.join.ok && s.join.reason && s.status !== 'ended' && s.status !== 'canceled' ? html`<span class="meta">${s.join.reason}</span>` : ''}
          ${s.status === 'live' && s.can_manage ? html`<button class="btn" type="button" data-act="sess.end" data-id="${s.id}">수업 종료</button>` : ''}
          ${joinBtn(s, false, true)}
          ${s.status === 'ended' && s.recording_url ? html`<a class="btn" href="${s.recording_url}" target="_blank" rel="noopener">${icon('play', 16)}녹화 보기</a>` : ''}
        </div>
      </section>
      <div class="cols">
        <div class="col-main">
          ${staff && s.can_manage ? P.sec('수업 기록', html`<form class="form" data-form="sess.record" novalidate>
              <input type="hidden" name="id" value="${s.id}">
              ${field('수업 내용', html`<textarea id="sr-sum" name="summary" rows="4" maxlength="5000" placeholder="오늘 다룬 내용을 학생이 다시 볼 수 있게 적어 주세요.">${s.summary}</textarea>`, '학생에게 보입니다.')}
              ${field('과제', html`<textarea id="sr-hw" name="homework" rows="2" maxlength="2000">${s.homework}</textarea>`, '학생에게 보입니다.')}
              ${field('외부 녹화 주소', html`<input id="sr-rec" name="recording_url" type="url" value="${s.recording_url}" placeholder="https://">`, 'Zoom 클라우드, Google Drive, Vimeo 등 다른 곳에 있는 녹화의 주소. 학생에게 보입니다. 이 강의실에서 녹화한 것은 아래 "녹화"에 자동으로 올라옵니다.')}
              ${field('내부 메모', html`<textarea id="sr-memo" name="staff_memo" rows="2" maxlength="5000">${s.staff_memo}</textarea>`, '컨설턴트와 관리자만 봅니다.')}
              <div class="form-end"><button class="btn btn-primary" type="submit">기록 저장</button></div>
            </form>`) : P.sec('수업 기록', html`
              ${s.summary ? html`<div class="prose">${nl2br(s.summary)}</div>` : html`<p class="none">${s.status === 'ended' ? '아직 기록이 올라오지 않았습니다.' : '수업이 끝나면 컨설턴트가 기록을 남깁니다.'}</p>`}
              ${s.homework ? html`<h3 class="sub">과제</h3><div class="prose">${nl2br(s.homework)}</div>` : ''}
              ${staff && s.staff_memo ? html`<h3 class="sub">내부 메모</h3><div class="prose">${nl2br(s.staff_memo)}</div>` : ''}`)}
          ${showRecs ? P.sec('녹화', html`<div id="rec-list">${P.recList(r.recordings, recOpt)}</div>
              ${s.can_manage && r.recordings.length ? html`<p class="hint">"수강생 공개"인 녹화만 다른 학생에게 보입니다. 학생이 직접 녹화한 것은 그 학생과 컨설턴트·관리자만 봅니다. 학생은 화면에서 재생만 할 수 있고 파일로 내려받을 수 없습니다.</p>` : ''}
              ${!staff && r.recordings.some((x) => x.mine) ? html`<p class="hint">내가 녹화한 수업은 나와 담당 컨설턴트만 볼 수 있습니다.</p>` : ''}`) : ''}
          ${staff ? P.sec('출석', r.attendance.length ? html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>이름</th><th>상태</th><th class="num">참여</th><th class="hide-sm">입장</th><th class="hide-sm">기록</th></tr></thead><tbody>
              ${r.attendance.map((a) => { const t = a.attendance; return html`<tr><td><a href="#/users/${a.user.id}">${a.user.name}</a></td>
                <td>${s.can_manage ? html`<select class="sel-sm att-${t ? t.status : 'none'}" aria-label="${a.user.name} 출석 상태" data-change="att.set" data-session="${s.id}" data-user="${a.user.id}">${t ? '' : opt('', '기록 없음', '')}${['present', 'late', 'absent', 'excused'].map((k) => opt(k, LABEL.att[k], t ? t.status : ''))}</select>` : attChip(t && t.status)}</td>
                <td class="num">${t && t.seconds ? fmt.secs(t.seconds) : '-'}</td><td class="hide-sm">${t && t.first_join_at ? fmt.time(t.first_join_at) : '-'}</td><td class="hide-sm">${t ? (t.source === 'manual' ? '직접 수정' : '자동') : '-'}${t && t.note ? ' · ' + t.note : ''}</td></tr>`; })}
            </tbody></table></div>` : html`<p class="none">수강생이 없습니다.</p>`) : ''}
          ${P.sec('자료', r.materials.length ? html`<ul class="rows">${r.materials.map((m) => P.matRow(m, { noCourse: true }))}</ul>` : html`<p class="none">이 회차에 연결된 자료가 없습니다.</p>`, s.can_manage ? html`<button class="btn btn-sm" type="button" data-act="mat.form" data-course="${s.course_id}" data-session="${s.id}">${icon('upload', 14)}자료 올리기</button>` : '')}
        </div>
        <aside class="col-side">${P.sec('내 메모', html`<div id="sess-notes">${App.parts.noteList(r.notes, {})}</div>${App.parts.noteForm({ session: s.id })}`)}</aside>
      </div>
    </div>`);
    if (recPending(r.recordings)) P.recWatch(ctx, 'session_id=' + s.id, recOpt);
  });
  on('sess.record', async (f) => {
    await API.patch('/sessions/' + f.id, { summary: f.summary, homework: f.homework, recording_url: f.recording_url, staff_memo: f.staff_memo });
    toast('수업 기록을 저장했습니다.');
  });
  on('sess.end', async (d) => {
    if (!(await ask({ title: '수업 종료', message: '수업을 종료할까요?', detail: '입장하지 않은 학생은 결석으로 기록됩니다. 종료 후에는 다시 입장할 수 없습니다.', yes: '수업 종료', danger: true }))) return;
    await API.post('/sessions/' + d.id + '/end', {});
    toast('수업을 종료했습니다. 수업 기록을 남겨 주세요.'); App.refresh();
  });
  on('att.set', async (d, el) => {
    if (!el.value) return;
    await API.put('/sessions/' + d.session + '/attendance/' + d.user, { status: el.value });
    el.className = 'sel-sm att-' + el.value;
    toast('출석을 ' + LABEL.att[el.value] + '(으)로 바꿨습니다.');
  });

  // ---------------------------------------------------------------- 일정
  App.route('/schedule', async (ctx) => {
    const st = ui.sched, today = new Date();
    if (!st.month) { st.month = new Date(today.getFullYear(), today.getMonth(), 1); st.sel = fmt.dayKey(today); }
    const first = new Date(st.month.getFullYear(), st.month.getMonth(), 1);
    const gridStart = new Date(first); gridStart.setDate(1 - first.getDay());
    const gridEnd = new Date(gridStart); gridEnd.setDate(gridStart.getDate() + 42);
    const admin = isAdmin();
    const [r, cons] = await Promise.all([
      API.get('/sessions?from=' + encodeURIComponent(gridStart.toISOString()) + '&to=' + encodeURIComponent(gridEnd.toISOString()) + (admin && st.consultant ? '&consultant_id=' + st.consultant : '')),
      admin ? API.get('/users/pick?role=consultant') : Promise.resolve({ users: [] })
    ]);
    if (!ctx.alive()) return;
    const byDay = {};
    r.sessions.forEach((s) => { const k = fmt.dayKey(new Date(s.starts_at)); (byDay[k] = byDay[k] || []).push(s); });
    App.header({
      title: '일정', sub: st.month.getFullYear() + '년 ' + (st.month.getMonth() + 1) + '월',
      actions: html`${admin ? html`<select class="sel-sm hide-sm" aria-label="컨설턴트 필터" data-change="sched.cons">${opt('', '전체 컨설턴트', st.consultant)}${cons.users.map((c) => opt(c.id, c.name, st.consultant))}</select>` : ''}
        <div class="btn-group"><button class="btn" type="button" data-act="sched.move" data-n="-1" aria-label="이전 달">${icon('chev-left', 16)}</button><button class="btn" type="button" data-act="sched.move" data-n="0">오늘</button><button class="btn" type="button" data-act="sched.move" data-n="1" aria-label="다음 달">${icon('chev-right', 16)}</button></div>`
    });
    const cells = [];
    for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }
    const weeks = cells[35].getMonth() === st.month.getMonth() ? 6 : 5;
    const selList = byDay[st.sel] || [];
    const selDate = new Date(st.sel + 'T00:00:00');
    setHTML(ctx.el, html`<div class="view-in">
      <div class="cal-wrap">
        <div class="cal" role="grid" aria-label="월간 일정">
          <div class="cal-h">${DOWS.map((d, i) => html`<span class="${i === 0 ? 'is-sun' : ''}">${d}</span>`)}</div>
          <div class="cal-g">${cells.slice(0, weeks * 7).map((d) => {
            const k = fmt.dayKey(d), list = byDay[k] || [], other = d.getMonth() !== st.month.getMonth();
            return html`<button type="button" class="cal-c${other ? ' is-other' : ''}${k === fmt.dayKey(today) ? ' is-today' : ''}${k === st.sel ? ' is-sel' : ''}" data-act="sched.pick" data-day="${k}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일, 수업 ${list.length}건">
              <b>${d.getDate()}</b>
              <span class="cal-ev">${list.slice(0, 3).map((s) => html`<i class="c-${s.course.color}${s.status === 'canceled' ? ' is-off' : ''}"><em>${fmt.time(s.starts_at)}</em> ${s.course.title}</i>`)}${list.length > 3 ? html`<small>+${list.length - 3}</small>` : ''}</span>
            </button>`;
          })}</div>
        </div>
        <section class="cal-day">
          <header class="sec-h"><h2>${fmt.date(selDate.toISOString())}</h2><span class="meta">${selList.length}건</span></header>
          ${selList.length ? html`<ul class="rows rows-tight">${selList.map((s) => P.sessRow(s, { timeOnly: true }))}</ul>` : html`<p class="none">이 날은 수업이 없습니다.</p>`}
        </section>
      </div>
    </div>`);
  });
  const DOWS = ['일', '월', '화', '수', '목', '금', '토'];
  on('sched.move', (d) => {
    const st = ui.sched, n = Number(d.n), t = new Date();
    if (n === 0) { st.month = new Date(t.getFullYear(), t.getMonth(), 1); st.sel = fmt.dayKey(t); }
    else { st.month = new Date(st.month.getFullYear(), st.month.getMonth() + n, 1); st.sel = fmt.dayKey(st.month); }
    App.refresh();
  });
  on('sched.pick', (d) => { ui.sched.sel = d.day; App.refresh(); });
  on('sched.cons', (d, el) => { ui.sched.consultant = el.value; App.refresh(); });
})(window.App);

/*
 * 화면 2: 자료실·자료 보기(메모), 메모 모아보기, 학생·강사 관리, 공지, 수업 시간, 설정, 내 정보.
 */
(function (App) {
  'use strict';
  const { html, raw, $, $$, setHTML, nl2br, fmt, LABEL, icon, API, Files, on, toast, modal, ask, chip, statusChip, attChip, dot, avatar, empty, skeleton, field, opt, bar, isStaff, isAdmin, DEMO } = App;
  const ui = App.ui, P = App.parts;
  const LG = window.LMS.langs;
  const PDF_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

  // ---------------------------------------------------------------- 메모 조각 (자료·회차·메모함에서 같이 쓴다)
  P.noteItem = (n, o) => {
    o = o || {};
    return html`<li class="note${n.shared ? ' is-shared' : ''}" data-note="${n.id}">
      <div class="note-h">
        ${n.ref ? (o.jump ? html`<button type="button" class="ref" data-act="viewer.jump" data-ref="${n.ref}">${n.ref}</button>` : html`<span class="ref">${n.ref}</span>`) : ''}
        ${o.author ? html`<b>${n.author ? n.author.name : ''}</b>` : ''}
        ${o.source ? html`<a class="note-src" href="#${n.material ? '/materials/' + n.material.id : n.session ? '/sessions/' + n.session.id : '/notes'}">${n.material ? n.material.title : n.session ? n.session.title : '출처 없음'}</a>` : ''}
        <span class="grow"></span>
        <time>${fmt.ago(n.updated_at)}</time>
        ${n.mine ? html`<button class="icon-btn icon-sm" type="button" data-act="note.edit" data-id="${n.id}" aria-label="메모 수정">${icon('edit', 14)}</button><button class="icon-btn icon-sm" type="button" data-act="note.del" data-id="${n.id}" aria-label="메모 삭제">${icon('trash', 14)}</button>` : ''}
      </div>

  const V = (App.viewer = { doc: null, page: 1, pages: 0, zoom: 1, kind: '', media: null, busy: false });
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new App.ApiError(0, { error: 'PDF 보기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.' })); document.head.appendChild(s); });

  }

  const showRef = () => { const e = $('#nf-ref'); if (e) e.textContent = curRef(); };
  async function drawPage() {
    if (!V.doc || V.busy) return;
    V.busy = true;
    try {
      const page = await V.doc.getPage(V.page);
      const box = $('#pdf-box');
      if (!box) return;
      const base = page.getViewport({ scale: 1 });
      const fit = Math.max(280, box.clientWidth - 2) / base.width;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: fit * V.zoom * dpr });
      const canvas = $('#pdf-canvas');
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      canvas.style.width = Math.floor(vp.width / dpr) + 'px'; canvas.style.height = Math.floor(vp.height / dpr) + 'px';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      $('#pdf-pos').textContent = V.page + ' / ' + V.pages;
      $$('[data-act="viewer.page"]').forEach((b) => { b.disabled = (b.dataset.n === '-1' && V.page <= 1) || (b.dataset.n === '1' && V.page >= V.pages); });
      showRef();
    } finally { V.busy = false; }
  }
  on('viewer.page', (d) => { const n = V.page + Number(d.n); if (n >= 1 && n <= V.pages) { V.page = n; return drawPage(); } });
  on('viewer.zoom', (d) => { V.zoom = Math.max(0.5, Math.min(3, d.n === '0' ? 1 : V.zoom + Number(d.n) * 0.25)); return drawPage(); });
  on('viewer.jump', (d) => {
    const m = /^p\.(\d+)$/.exec(d.ref || '');
    if (m && V.kind === 'pdf') { const n = Number(m[1]); if (n >= 1 && n <= V.pages) { V.page = n; return drawPage(); } }
    const t = /^(\d+):(\d{2})$/.exec(d.ref || '');
    if (t && V.media) { V.media.currentTime = Number(t[1]) * 60 + Number(t[2]); }
  });
  on('viewer.download', async (d) => { const o = await API.post('/materials/' + d.id + '/open', { download: 1 }); await Files.download(o.url, o.name); });
  on('viewer.tab', (d) => { ui.viewerTab = d.tab; $$('.vside [data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== d.tab; }); $$('.vside .tabs button').forEach((b) => b.classList.toggle('is-on', b.dataset.tab === d.tab)); });

  V.mount = async function (box, m, alive) {
    Object.assign(V, { doc: null, page: 1, pages: 0, zoom: 1, kind: m.viewer, media: null, busy: false });
    setHTML(box, skeleton(8));
    let off = null;
    try {

      if (!alive()) return null;
        if (o.kind === 'link') {
          if (o.embed && !DEMO()) setHTML(box, html`<div class="embed"><iframe src="${o.embed}" title="${m.title}" allow="fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`);

        } else if (o.viewer === 'pdf') {
          await ensurePdf();
          const bytes = await Files.bytes(o.url);
          if (!alive()) return null;
          V.doc = await window.pdfjsLib.getDocument({ data: DEMO() ? bytes.slice(0) : bytes }).promise;
          V.pages = V.doc.numPages;

            <div class="btn-group"><button class="btn btn-sm" type="button" data-act="viewer.zoom" data-n="-1" aria-label="축소">${icon('minus', 16)}</button><button class="btn btn-sm" type="button" data-act="viewer.zoom" data-n="0">맞춤</button><button class="btn btn-sm" type="button" data-act="viewer.zoom" data-n="1" aria-label="확대">${icon('plus', 16)}</button></div></div>
            <div class="pdf-box" id="pdf-box"><canvas id="pdf-canvas"></canvas></div>`);
          await drawPage();
          let rt;
          const onResize = () => { clearTimeout(rt); rt = setTimeout(drawPage, 150); };
          window.addEventListener('resize', onResize);
          off = () => { window.removeEventListener('resize', onResize); if (V.doc) { V.doc.destroy(); V.doc = null; } };
        } else if (o.viewer === 'image') {

          V.media = $('#media', box);
          V.media.addEventListener('timeupdate', showRef);

          setHTML(box, html`<pre class="doc">${new TextDecoder('utf-8').decode(await Files.bytes(o.url))}</pre>`);
        } else {

        }

      if (!alive()) return off;
      if (!(e instanceof App.ApiError)) console.error(e);

/*
 * 강의실 실시간 번역 자막.
 *   말하는 쪽: 브라우저의 음성 인식(Web Speech API)으로 말을 글로 바꿔 수업 방에 보낸다. 말하는 도중에도 보낸다.

 * 서버에 번역 엔진이 없으면 브라우저 내장 번역(지원하는 브라우저·언어만)을 쓰고, 그것도 없으면 원문 자막만 보여 준다.
 * 음성 인식을 쓸 수 없는 브라우저에서는 글로 적어 보낼 수 있다(같은 경로로 번역된다).

  function reset() {

    clearTimeout(T.restart);
    Object.keys(T.timers || {}).forEach((k) => clearTimeout(T.timers[k]));
    Object.assign(T, { speak: 'ko', read: 'ko', stt: false, orig: false, server: false, rec: null, recErr: '', seq: 0, curId: null, lastSent: 0, lastTr: 0, since: 0, log: [], live: [], timers: {}, mt: {}, on: false, restart: null });
  }
  reset();
  const langName = (c) => (LG.byCode[c] ? LG.byCode[c].name : c);
  function load() {
    const u = App.state.user, mine = (u.profile && u.profile.lang) || 'ko';

  T.paneHTML = () => html`
    <div class="tr-set">

      <label class="field"><span class="field-l">자막으로 볼 언어</span><select id="tr-read" data-change="tr.lang">${LG.LANGS.map((l) => opt(l.code, l.name, T.read))}</select></label>

    $('#pre-msg').textContent = L.error || (L.mic && L.cam ? '카메라와 마이크가 준비됐습니다.' : L.mic ? '마이크만 켜진 상태입니다.' : L.cam ? '카메라만 켜진 상태입니다.' : '카메라와 마이크가 꺼져 있습니다. 듣기만 하는 상태로 입장합니다.');
  }
  // 시험 영상: 카메라 대신 움직이는 화면을 만든다. (백그라운드 탭에서도 돌도록 setInterval 을 쓴다)
  function makeTestMedia(name) {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 360;
    const g = c.getContext('2d');
    let t = 0;
    const hue = (name.charCodeAt(0) * 37) % 360;
    const draw = () => {
      t++;
      g.fillStyle = 'hsl(' + hue + ',45%,22%)'; g.fillRect(0, 0, 640, 360);
      g.fillStyle = 'hsl(' + ((hue + 40) % 360) + ',70%,60%)';
      g.beginPath(); g.arc(320 + Math.cos(t / 12) * 200, 180 + Math.sin(t / 9) * 90, 34, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.font = '700 30px sans-serif'; g.textAlign = 'center'; g.fillText(name, 320, 170);
      g.font = '500 18px sans-serif'; g.fillText('시험 영상 · ' + new Date().toLocaleTimeString('ko-KR'), 320, 205);
    };
    draw();
    R.local.timer = setInterval(draw, 100);
    R.local.video = c.captureStream(10).getVideoTracks()[0];
    R.local.cam = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC(), osc = ac.createOscillator(), gain = ac.createGain(), dest = ac.createMediaStreamDestination();
      gain.gain.value = 0.0001; osc.connect(gain); gain.connect(dest); osc.start();
      R.local.audio = dest.stream.getAudioTracks()[0]; R.local.mic = true; R.local.ac = ac;
    } catch (e) { /* 소리 없는 시험 영상 */ }
    R.local.test = true;
  }

  // ---------------------------------------------------------------- 입장
  on('room.enter', async (d) => {
    const L = R.local;
    if (d.test) { stopLocal(); L.error = ''; makeTestMedia(App.state.user.name); }
    const r = await API.post('/sessions/' + R.sid + '/join', {});
    R.session = r.session; R.room = r.room; R.active = true;
    R.sim = !!DEMO() && r.room.provider === 'builtin';
    renderRoom();
    R.beat = setInterval(beat, 30000);
    R.clock = setInterval(tick, 1000); tick();
    keepAwake();
    reloadNotes();
    if (r.room.provider === 'builtin') { if (R.sim) startSim(); else connect(); }
    else if (r.room.provider === 'jitsi') startJitsi();
    else setHTML($('#stage'), html`<div class="stage-card">${icon('ext', 32)}<h2>외부 화상회의로 진행합니다</h2><p>아래 버튼을 누르면 새 탭에서 회의가 열립니다. 이 화면을 열어 두면 메모와 자료를 함께 쓸 수 있습니다.</p><a class="btn btn-primary btn-lg" href="${r.room.url}" target="_blank" rel="noopener">${icon('ext', 18)}회의 열기</a><p class="url">${r.room.url}</p></div>`);
    if (L.error && r.room.provider === 'builtin' && !R.sim) toast(L.error, 'info', 7000);
  });
  // 수업이 길어도 화면이 꺼지지 않게 한다(화면이 꺼지면 연결과 녹화가 끊긴다). 다른 창에 갔다 오면 다시 건다.
  // 브라우저가 지원하지 않거나 거절하면 그냥 넘어간다.
  async function keepAwake() {
    if (!R.active || R.wake || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (!R.active) { lock.release().catch(() => {}); return; }
      R.wake = lock;
      lock.addEventListener('release', () => { if (R.wake === lock) R.wake = null; });
    } catch (e) { /* 절전 모드 등으로 거절됨 */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  async function beat() {
    if (!R.active) return;
    try {
      const r = await API.post('/sessions/' + R.sid + '/beat', {});
      if (r.status === 'ended' && !R.ended) onEnded();
      else if (r.status === 'live' && R.session.status !== 'live') { R.session.status = 'live'; R.session.started_at = R.session.started_at || new Date().toISOString(); tick(); }
    } catch (e) { /* 일시적인 실패는 다음 주기에 다시 시도 */ }
  }
  function tick() {
    const el = $('#room-clock'), s = R.session;
    if (!el) return;
    if (s.status === 'live') {
      const sec = Math.max(0, Math.floor((Date.now() - Date.parse(s.started_at || s.starts_at)) / 1000));
      el.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
      $('#room-state').className = 'chip chip-live'; setHTML($('#room-state'), html`<i class="dot"></i>진행 중`);
    } else {
      el.textContent = fmt.time(s.starts_at) + ' 시작';
      $('#room-state').className = 'chip'; $('#room-state').textContent = '대기 중';
    }
  }

  // ---------------------------------------------------------------- 강의실 화면

          <button class="rbtn" type="button" id="rb-mic" data-act="room.toggle" data-k="mic" aria-label="마이크">${icon('mic-off', 20)}<span>마이크</span></button>
          <button class="rbtn" type="button" id="rb-cam" data-act="room.toggle" data-k="cam" aria-label="카메라">${icon('video-off', 20)}<span>카메라</span></button>

          ${canRec ? html`<button class="rbtn hide-sm" type="button" id="rb-rec" data-act="room.rec" aria-label="수업 녹화">${icon('rec', 20)}<span>녹화</span></button>` : ''}` : ''}</div>
        <div class="rb-g">
          ${builtin ? html`<button class="rbtn" type="button" data-act="room.side" data-k="chat" aria-label="채팅">${icon('chat', 20)}<span>채팅</span><i class="badge" id="chat-badge" hidden></i></button>
          <button class="rbtn hide-sm" type="button" data-act="room.side" data-k="people" aria-label="참여자">${icon('users', 20)}<span>참여자</span></button>
          <button class="rbtn" type="button" data-act="room.side" data-k="tr" aria-label="번역 자막">${icon('lang', 20)}<span>번역</span></button>` : ''}
          <button class="rbtn" type="button" data-act="room.side" data-k="notes" aria-label="메모">${icon('note', 20)}<span>메모</span></button>
          <button class="rbtn" type="button" data-act="room.side" data-k="files" aria-label="자료">${icon('folder', 20)}<span>자료</span></button>
        </div>

          ${host ? html`<button class="btn btn-danger" type="button" data-act="room.end">수업 종료</button>` : ''}

        </div>
      </footer>
    </div>`);
    renderFiles();
    if (builtin) { App.tr.start(); addTile('me', App.state.user.name + ' (나)', true); syncLocal(); renderPeople(); App.rec.mount(); }
    if (!builtin && window.matchMedia('(min-width: 900px)').matches) openSide('notes');
  }
  const R_el = () => $('#bare');
  function openSide(k) {
    const room = $('#room');
    if (!room) return;
    R.side = R.side === k ? '' : k;
    room.dataset.side = R.side;
    $$('.rs-pane', room).forEach((p) => { p.hidden = p.dataset.pane !== R.side; });
    $$('.rs-h .tabs button', room).forEach((b) => b.classList.toggle('is-on', b.dataset.k === R.side));
    $$('.room-bar [data-act="room.side"]', room).forEach((b) => b.classList.toggle('is-on', b.dataset.k === R.side));
    if (R.side === 'chat') { R.unread = 0; $('#chat-badge').hidden = true; const l = $('#chat-list'); l.scrollTop = l.scrollHeight; }
    setTimeout(layout, 30);
  }
  on('room.side', (d) => openSide(d.k === R.side ? d.k : d.k || R.side));
  function renderFiles() {
    const list = R.info.materials || [];
    setHTML($('#room-files'), html`${list.length ? html`<ul class="rows rows-tight">${list.map((m) => html`<li class="row"><span class="row-ic">${icon('file')}</span><div class="row-main"><button type="button" class="row-t linklike" data-act="room.file" data-id="${m.id}">${m.title}</button><span class="row-s">${m.file_name || m.url}</span></div></li>`)}</ul>` : html`<p class="none">이 회차에 연결된 자료가 없습니다.</p>`}
      <p class="hint">자료를 열어도 수업 연결은 유지됩니다. 과정의 다른 자료는 수업이 끝난 뒤 자료실에서 볼 수 있습니다.</p>`);
  }
  on('room.file', async (d) => {
    const r = await API.get('/materials/' + d.id);
    const m = r.material;
    let cleanup = null;
    const layer = modal({
      title: m.title, wide: true, noFocus: true,
      body: html`<div class="vmain vmain-in" id="vmain"></div>${P.noteForm({ material: m.id, refable: m.viewer === 'pdf', ref: 'p.1' })}`,
      onClose: () => { if (cleanup) cleanup(); }
    });
    cleanup = await App.viewer.mount($('#vmain', layer.el), m, () => layer.el.isConnected);
  });
  async function reloadNotes() {
    const box = $('#room-notes');
    if (!box) return;
    try { setHTML(box, P.noteList((await API.get('/notes?session_id=' + R.sid)).notes, { none: '아직 메모가 없습니다.' })); } catch (e) { /* 다음 저장 때 다시 읽는다 */ }
  }
  R.reloadNotes = reloadNotes;

  // ---------------------------------------------------------------- 참가자 칸(타일)
  function addTile(id, name, self) {
    const stage = $('#stage');
    if (!stage || $('[data-tile="' + id + '"]', stage)) return;
    const el = document.createElement('div');
    el.className = 'tile' + (self ? ' is-self' : '');
    el.dataset.tile = id;
    el.innerHTML = html`<video autoplay playsinline${self ? raw(' muted') : ''}></video>
      <div class="tile-off">${avatar(name, 'av-xl')}</div>
      <div class="tile-l"><span class="tile-ic"></span><b>${name}</b></div>
      <span class="tile-st" hidden></span>`.s;
    el.addEventListener('dblclick', () => { R.pin = R.pin === id ? null : id; layout(); });
    stage.appendChild(el);
    layout();
  }
  function setTile(id, o) {
    const el = $('[data-tile="' + id + '"]');
    if (!el) return;
    if (o.stream !== undefined) { const v = $('video', el); if (v.srcObject !== o.stream) v.srcObject = o.stream; if (o.stream) v.play().catch(() => {}); }
    if (o.state) {
      el.classList.toggle('no-video', !(o.state.cam || o.state.screen));
      el.classList.toggle('is-screen', !!o.state.screen);
      el.classList.toggle('is-hand', !!o.state.hand);
      setHTML($('.tile-ic', el), html`${o.state.hand ? icon('hand', 14) : ''}${o.state.mic ? '' : icon('mic-off', 14)}`);
    }
    if (o.status !== undefined) { const st = $('.tile-st', el); st.hidden = !o.status; st.textContent = o.status || ''; }
  }
  function layout() {
    const stage = $('#stage');
    if (!stage || R.room.provider !== 'builtin') return;
    const tiles = $$('.tile', stage);
    let spot = R.pin && $('[data-tile="' + R.pin + '"]', stage) ? R.pin : null;
    if (!spot) { const sc = tiles.filter((t) => t.classList.contains('is-screen'))[0]; if (sc) spot = sc.dataset.tile; }
    stage.dataset.n = String(tiles.length);
    stage.classList.toggle('is-spot', !!spot && tiles.length > 1);
    tiles.forEach((t) => t.classList.toggle('is-main', t.dataset.tile === spot));
    const n = $('#room-n b'); if (n) n.textContent = String(tiles.length);
  }

  // ---------------------------------------------------------------- 내 상태
  const myState = () => ({ mic: !!R.local.mic, cam: !!(R.local.cam && R.local.video), hand: !!R.local.hand, screen: !!R.local.screen });
  function syncLocal() {
    const L = R.local, st = myState();
    if (L.audio) L.audio.enabled = L.mic;
    setTile('me', { stream: R.sim ? null : localStream(), state: st });
    const mine = $('[data-tile="me"]'); if (mine) mine.classList.toggle('no-mirror', !!L.test);
    const set = (id, onIcon, offIcon, isOn, label) => { const b = $(id); if (!b) return; setHTML(b, html`${icon(isOn ? onIcon : offIcon, 20)}<span>${label}</span>`); b.classList.toggle('is-off', !isOn); b.setAttribute('aria-pressed', String(isOn)); };
    set('#rb-mic', 'mic', 'mic-off', st.mic, '마이크');
    set('#rb-cam', 'video', 'video-off', st.cam, '카메라');
    const sc = $('#rb-screen'); if (sc) { sc.classList.toggle('is-on', st.screen); sc.setAttribute('aria-pressed', String(st.screen)); }
    const hd = $('#rb-hand'); if (hd) { hd.classList.toggle('is-on', st.hand); hd.setAttribute('aria-pressed', String(st.hand)); }
    R.peers.forEach((p) => { if (p.pc) setSenders(p); });
    send({ t: 'state', state: st });
    renderPeople();
    layout();
    App.tr.micChanged();
  }
  on('room.toggle', async (d) => {
    const L = R.local, k = d.k;
    if (R.sim) {                       // 미리보기: 상태 표시만 바꾼다
      if (k === 'screen') { toast('화면 공유는 서버에 배포한 뒤 쓸 수 있습니다.', 'info'); return; }
      if (k === 'mic') L.mic = !L.mic; else if (k === 'cam') { L.cam = !L.cam; L.video = L.cam ? {} : null; } else L.hand = !L.hand;
      syncLocal(); return;
    }
    if (k === 'mic') {
      if (!L.audio) { await openCamera(true, false); if (!L.audio) { toast(L.error || '마이크를 켜지 못했습니다.', 'bad'); } }
      else L.mic = !L.mic;
    } else if (k === 'cam') {
      if (L.cam && L.video) { if (!L.test) { L.video.stop(); L.video = null; } L.cam = false; }
      else if (L.video) L.cam = true;
      else { await openCamera(false, true); if (!L.video) toast(L.error || '카메라를 켜지 못했습니다.', 'bad'); }
    } else if (k === 'hand') {
      L.hand = !L.hand;
    } else if (k === 'screen') {
      if (L.screen) stopScreen();
      else {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { toast('이 기기에서는 화면 공유를 쓸 수 없습니다.', 'info'); return; }
        try {
          const st = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 15 } }, audio: false });
          L.screen = st.getVideoTracks()[0];
          L.screen.addEventListener('ended', stopScreen);
        } catch (e) { return; }           // 사용자가 공유 창을 닫음
      }
    }
    if (R.active) syncLocal(); else preSync();
  });
  function stopScreen() { const L = R.local; if (L.screen) { L.screen.stop(); L.screen = null; } if (R.active) syncLocal(); }
  function stopLocal() {
    const L = R.local;
    [L.audio, L.video, L.screen].forEach((t) => { if (t && t.stop) t.stop(); });
    if (L.timer) clearInterval(L.timer);
    if (L.ac) { try { L.ac.close(); } catch (e) { /* 이미 닫힘 */ } }
    Object.assign(L, { audio: null, video: null, screen: null, mic: false, cam: false, timer: null, ac: null, test: false });
  }

  // ---------------------------------------------------------------- 실시간 중계 연결
  function send(msg) { if (R.ws && R.ws.readyState === 1) R.ws.send(JSON.stringify(msg)); }
  R.send = send;
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/rt');
    R.ws = ws;
    ws.onopen = () => { R.wsTry = 0; ws.send(JSON.stringify({ t: 'hello', token: API.token, session: R.sid, state: myState(), lang: App.tr.hello() })); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } handle(m).catch((x) => console.error('[room]', x)); };
    ws.onclose = (e) => {
      if (R.ws !== ws || R.closing || !R.active || R.ended) return;
      if (e.code === 4005) { toast('진행자가 수업에서 내보냈습니다.', 'info', 6000); leave(); return; }
      dropPeers();
      setTile('me', { status: '연결이 끊겼습니다. 다시 연결하는 중' });
      if (++R.wsTry > 8) { toast('수업 서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 입장해 주세요.', 'bad', 8000); return; }
      setTimeout(() => { if (R.active && !R.closing) connect(); }, Math.min(8000, 800 * R.wsTry));
    };
  }
  // 강의형에서는 학생끼리 연결하지 않는다.
  const shouldLink = (peer) => R.room.mode !== 'lecture' || R.me.host || peer.host;
  async function handle(m) {
    if (m.t === 'welcome') {
      R.me = m.you; dropPeers(); setTile('me', { status: '' });
      App.tr.onWelcome(m);
      App.rec.onMessage(m);
      for (const p of m.peers) { addPeer(p); if (shouldLink(p)) await link(p.id, true); }
      renderPeople();
    } else if (m.t === 'peer-join') {
      addPeer(m.peer); renderPeople();
      if (m.peer.host && R.session.status !== 'live') { R.session.status = 'live'; R.session.started_at = new Date().toISOString(); tick(); }
    } else if (m.t === 'peer-leave') {
      removePeer(m.id); renderPeople();
    } else if (m.t === 'signal') {
      const p = R.peers.get(m.from);
      if (!p) return;
      if (!p.pc) await link(m.from, false);
      await onSignal(p, m.data || {});
    } else if (m.t === 'state') {
      const p = R.peers.get(m.from);
      if (p) { p.state = m.state; setTile(p.id, { state: p.state }); renderPeople(); layout(); }
    } else if (m.t === 'chat') {
      const c = { id: m.id, name: m.user.name, text: m.text, at: m.at, mine: m.from === R.me.id, tr: '' };
      R.chat.push(c);
      renderChat(true);
      // 서버 번역 엔진이 없으면 브라우저 내장 번역을 시도한다

/*

 *   1) 강의실에 보이는 참가자 화면을 캔버스 한 장에 모아 그리고, 모든 사람의 소리를 하나로 섞는다.

 *   3) 조각을 번호 순서대로 서버에 올린다. 연결이 잠깐 끊기면 다시 보낸다.
 *   4) 멈추면 서버가 파일을 정리해 수업 정보의 "녹화"에 올린다.
 * 영상이 서버를 거치지 않는 방식(참가자끼리 직접 연결)이라 녹화도 각자의 기기가 맡는다.
 * 조각은 올라가는 대로 메모리에서 비우므로 수업이 길어져도 쌓이지 않는다(1시간 넘는 수업 기준으로 만들었다).
 * 녹화하던 사람이 탭을 닫으면 그때까지 올라간 부분만 남고, 서버가 몇 분 뒤 자동으로 마감한다.
 * 학생이 녹화한 것은 본인과 담당 컨설턴트·관리자만 본다. 학생과 휴대폰은 기기 부담을 줄이려고 절약 화질로 녹화한다.

      let name = ((el.querySelector('.tile-l b') || {}).textContent || '').trim();
      if (el.dataset.tile === 'me') name = name.replace(/\s*\(나\)$/, '') + (host ? ' · 진행자' : '');
      return { video: el.querySelector('video'), name, main: el.classList.contains('is-main'), screen: el.classList.contains('is-screen'), off: el.classList.contains('no-video') };
    });
  }
  // 한 사람을 크게 보는 중이면 그 사람을 왼쪽에 크게, 나머지를 오른쪽에 세로로 놓는다. 아니면 바둑판으로 놓는다.
  function arrange(list, x, y, w, h) {
    const gap = 6, out = [];
    const main = list.filter((t) => t.main)[0];
    if (main && list.length > 1) {
      const sw = Math.round(w * 0.2), th = Math.round((sw * 9) / 16);
      const fit = Math.max(1, Math.floor((h + gap) / (th + gap)));
      out.push({ t: main, x, y, w: w - sw - gap, h });
      list.filter((t) => t !== main).slice(0, fit).forEach((t, i) => out.push({ t, x: x + w - sw, y: y + i * (th + gap), w: sw, h: th }));
      return out;
    }
    // 칸은 16:9 로 두어 카메라 화면이 잘리지 않게 한다. 칸이 가장 커지는 줄 수를 고른다.
    const n = list.length;
    let cols = 1, tw = 0;
    for (let c = 1; c <= n; c++) {
      const rs = Math.ceil(n / c), fit = Math.min((w - gap * (c - 1)) / c, (((h - gap * (rs - 1)) / rs) * 16) / 9);
      if (fit > tw) { tw = fit; cols = c; }
    }
    const rows = Math.ceil(n / cols), th = (tw * 9) / 16, top = y + (h - (rows * th + (rows - 1) * gap)) / 2;
    list.forEach((t, i) => {
      const r = Math.floor(i / cols), inRow = r === rows - 1 ? n - cols * (rows - 1) : cols;
      const left = (w - (inRow * tw + (inRow - 1) * gap)) / 2;
      out.push({ t, x: Math.round(x + left + (i % cols) * (tw + gap)), y: Math.round(top + r * (th + gap)), w: Math.round(tw), h: Math.round(th) });
    });
    return out;
  }
  function drawTile(g, b, H) {
    const t = b.t, v = t.video;
    g.fillStyle = '#161d30'; g.fillRect(b.x, b.y, b.w, b.h);
    if (v && !t.off && v.readyState >= 2 && v.videoWidth > 0) {
      const vr = v.videoWidth / v.videoHeight, br = b.w / b.h;
      try {
        if (t.screen) {                 // 공유 화면은 잘리지 않게 전체를 넣는다
          let dw = b.w, dh = b.w / vr;
          if (dh > b.h) { dh = b.h; dw = b.h * vr; }
          g.drawImage(v, b.x + (b.w - dw) / 2, b.y + (b.h - dh) / 2, dw, dh);
        } else {                        // 카메라는 칸을 채운다
          let sw = v.videoWidth, sh = sw / br;
          if (sh > v.videoHeight) { sh = v.videoHeight; sw = sh * br; }
          g.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, b.x, b.y, b.w, b.h);
        }
      } catch (e) { /* 이 순간에는 그릴 장면이 없다 */ }
    } else {
      const r = Math.min(b.w, b.h) * 0.2;
      g.fillStyle = '#2a3554'; g.beginPath(); g.arc(b.x + b.w / 2, b.y + b.h / 2, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.font = '700 ' + Math.round(r) + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText((t.name || '?').slice(0, 1), b.x + b.w / 2, b.y + b.h / 2 + r * 0.06);
    }
    if (!t.name) return;
    const fs = Math.max(11, Math.round(Math.min(b.h * 0.075, H * 0.03))), lh = Math.round(fs * 1.9);
    g.font = '700 ' + fs + 'px ' + FONT; g.textAlign = 'left'; g.textBaseline = 'middle';
    const tw = Math.min(b.w, g.measureText(t.name).width + fs * 1.4);
    g.fillStyle = 'rgba(8,11,20,.78)'; g.fillRect(b.x, b.y + b.h - lh, tw, lh);
    g.fillStyle = '#fff'; g.fillText(t.name, b.x + fs * 0.7, b.y + b.h - lh / 2, b.w - fs * 1.4);
  }
  // 진행자 화면에 떠 있던 자막(번역 포함)을 그대로 함께 남긴다.
  function drawCaps(g, W, H) {
    const box = $('#caps');
    if (!box || box.hidden) return;
    const lines = $$('.cap', box).slice(-2).map((p) => {
      const who = p.querySelector('b'), what = p.querySelector('span');
      return ((who ? who.textContent + '  ' : '') + (what ? what.textContent : '')).trim();
    }).filter(Boolean);
    if (!lines.length) return;
    const fs = Math.round(H * 0.034), lh = Math.round(fs * 1.7);
    g.font = '500 ' + fs + 'px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((text, i) => {
      while (text.length > 12 && g.measureText(text).width > W * 0.88) text = '…' + text.slice(Math.ceil(text.length * 0.12) + 1);   // 길면 뒷부분을 보여 준다
      const tw = g.measureText(text).width + fs * 1.2, y = H - Math.round(H * 0.035) - (lines.length - i) * (lh + 4);
      g.fillStyle = 'rgba(8,11,20,.82)'; g.fillRect((W - tw) / 2, y, tw, lh);
      g.fillStyle = '#fff'; g.fillText(text, W / 2, y + lh / 2);
    });
  }
  function draw() {
    const c = rec.canvas, g = rec.g;
    if (!c) return;
    const W = c.width, H = c.height, head = Math.round(H * 0.05);
    g.fillStyle = '#0b1020'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#132143'; g.fillRect(0, 0, W, head);
    const d = new Date();
    const stamp = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '  ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    g.fillStyle = '#fff'; g.textBaseline = 'middle';
    g.font = '500 ' + Math.round(head * 0.46) + 'px ' + FONT; g.textAlign = 'right';
    g.fillText(stamp, W - 14, head / 2);
    g.font = '700 ' + Math.round(head * 0.5) + 'px ' + FONT; g.textAlign = 'left';
    g.fillText(rec.label || '', 14, head / 2, W - g.measureText(stamp).width - 60);
    const list = tiles();
    if (list.length) arrange(list, 0, head + 6, W, H - head - 6).forEach((b) => drawTile(g, b, H));
    drawCaps(g, W, H);
  }

  // ---------------------------------------------------------------- 소리 섞기
  function buildAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC(), dest = ac.createMediaStreamDestination();
    // 아무도 말하지 않아도 소리 줄이 끊기지 않도록 소리 없는 신호를 계속 넣는다
    const osc = ac.createOscillator(), mute = ac.createGain();
    mute.gain.value = 0; osc.connect(mute); mute.connect(dest); osc.start();
    return { ac, dest, osc, sources: new Map() };
  }
  // 지금 있는 사람들의 소리 줄을 맞춘다. 사람이 들어오고 나가거나 마이크를 새로 켜도 따라간다.
  function syncAudio() {
    const A = rec.audio, R = App.room;
    if (!A || !R) return;
    const want = new Map();
    const mine = R.local && R.local.audio;
    if (mine && mine.readyState === 'live') want.set(mine.id, mine);
    if (R.peers) R.peers.forEach((p) => { if (p.stream) p.stream.getAudioTracks().forEach((t) => { if (t.readyState === 'live') want.set(t.id, t); }); });
    A.sources.forEach((node, id) => { if (!want.has(id)) { try { node.disconnect(); } catch (e) { /* 이미 끊김 */ } A.sources.delete(id); } });
    want.forEach((track, id) => {
      if (A.sources.has(id)) return;
      try { const node = A.ac.createMediaStreamSource(new MediaStream([track])); node.connect(A.dest); A.sources.set(id, node); } catch (e) { /* 이 소리는 섞지 못한다 */ }
    });
  }

  // 화면을 그리는 박자. 탭이 뒤로 가면 브라우저가 타이머를 늦추므로(화면 공유 중 흔한 상황) 워커에서 박자를 받는다.
  function startTicks(ms) {
    // 한 번 그릴 때마다 그 장면을 직접 한 장 찍는다(rec.shot). 브라우저가 알아서 찍게 두면 내부 타이머에 맞춰 찍느라
    // PC 가 바쁘거나 탭이 뒤에 있을 때 장면을 빼먹는다.
    const step = () => { if (!rec.canvas) return; draw(); if (rec.shot) rec.shot(); if (++rec.frames % 15 === 0) syncAudio(); };
    const plain = () => { rec.timer = setInterval(step, ms); };
    try {
      const src = 'var t=null;self.onmessage=function(e){clearInterval(t);if(e.data>0)t=setInterval(function(){self.postMessage(1)},e.data)}';
      rec.workerUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      const w = new Worker(rec.workerUrl);
      w.onmessage = step;
      w.onerror = () => { if (rec.worker === w) { w.terminate(); rec.worker = null; if (rec.canvas && !rec.timer) plain(); } };
      w.postMessage(ms);
      rec.worker = w;
    } catch (e) { plain(); }
  }
  function stopTicks() {
    if (rec.worker) { try { rec.worker.terminate(); } catch (e) { /* 이미 끝남 */ } rec.worker = null; }
    if (rec.workerUrl) { URL.revokeObjectURL(rec.workerUrl); rec.workerUrl = null; }
    if (rec.timer) { clearInterval(rec.timer); rec.timer = null; }
  }
  function teardown() {
    stopTicks();
    if (rec.stream) rec.stream.getTracks().forEach((t) => { try { t.stop(); } catch (e) { /* 이미 멈춤 */ } });
    if (rec.audio) { try { rec.audio.osc.stop(); rec.audio.ac.close(); } catch (e) { /* 이미 닫힘 */ } }
    Object.assign(rec, { canvas: null, g: null, audio: null, stream: null, mr: null, shot: null });
  }

  // ---------------------------------------------------------------- 조각 올리기
  function fatal(message) {
    if (rec.dead) return;
    rec.dead = true; rec.queue.length = 0;
    toast(message, 'bad', 9000);
    rec.stop('fatal');
  }
  // true: 서버가 받았다.  false: 더 보낼 수 없다(사유는 이미 알렸다).
  async function sendChunk(id, seq, blob) {
    if (rec.demo) { rec.demo.push(blob); return true; }
    // 약 2분 40초 동안 다시 보낸다(서버 재시작이나 잠깐의 끊김을 넘긴다). 서버는 3분 동안 조각이 없으면 녹화를 마감한다.
    for (let attempt = 0; attempt < 24; attempt++) {
      let res = null, body = {};
      try {
        res = await fetch('/api/recordings/' + id + '/chunk?seq=' + seq, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream', Authorization: 'Bearer ' + API.token }, body: blob });
        try { body = await res.json(); } catch (e) { /* 본문 없음 */ }
      } catch (e) { res = null; }
      if (res && res.ok) return true;
      if (res && res.status === 409 && body.next > seq) return true;          // 이미 받은 조각 (응답만 못 받았던 경우)
      if (res && res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429) { fatal(body.error || '녹화를 서버에 저장하지 못해 멈췄습니다.'); return false; }
      if (res && res.status === 507) { fatal(body.error || '서버 저장 공간이 부족해 녹화를 멈췄습니다.'); return false; }
      if (rec.dead) return false;
      await wait(Math.min(8000, 400 * Math.pow(2, attempt)));
    }
    fatal('서버에 연결되지 않아 녹화를 멈췄습니다. 지금까지 올라간 부분은 저장됩니다.');
    return false;
  }
  async function pump() {
    if (rec.pumping) return;
    rec.pumping = true;
    try {
      while (rec.queue.length && !rec.dead) {
        const blob = rec.queue[0];
        if (!(await sendChunk(rec.id, rec.seq, blob))) break;
        rec.queue.shift(); rec.seq++; rec.sent += blob.size;
      }
    } finally { rec.pumping = false; }
  }
  async function drain() {
    const t0 = Date.now();
    pump();
    while ((rec.pumping || rec.queue.length) && !rec.dead && Date.now() - t0 < 120000) await wait(100);
  }

  // ---------------------------------------------------------------- 시작·중지
  rec.start = async function () {
    const R = App.room, cfg = App.state.config || {};
    // 학생과 휴대폰은 절약 화질로 녹화한다(기기 부담과 용량을 줄인다). 진행자 PC 는 관리자가 정한 화질을 따른다.
    const q = !R.room.host || small() ? QUALITY.light : QUALITY[(cfg.record || {}).quality] || QUALITY.standard;
    const mime = pickMime();
    const r = await API.post('/sessions/' + R.sid + '/recordings', { mime });
    Object.assign(rec, {
      id: r.recording.id, sid: R.sid, mime, queue: [], seq: 0, sent: 0, frames: 0, dead: false, demo: DEMO() ? [] : null,
      label: (R.session.course ? R.session.course.title + ' · ' : '') + R.session.title
    });
    try {
      rec.canvas = document.createElement('canvas');
      rec.canvas.width = q.w; rec.canvas.height = q.h;
      rec.g = rec.canvas.getContext('2d', { alpha: false });
      rec.audio = buildAudio();
      if (rec.audio.ac.state === 'suspended') await rec.audio.ac.resume();
      syncAudio(); draw();
      // 장면은 우리가 그린 직후에 직접 찍는다(captureStream(0) + requestFrame). 지원하지 않는 브라우저는 초당 장수만 정해 맡긴다.
      let vt = null;
      try { vt = rec.canvas.captureStream(0).getVideoTracks()[0]; } catch (e) { vt = null; }
      if (vt && typeof vt.requestFrame === 'function') rec.shot = () => { try { vt.requestFrame(); } catch (e) { /* 이번 장면은 건너뛴다 */ } };
      else { if (vt) vt.stop(); vt = rec.canvas.captureStream(q.fps).getVideoTracks()[0]; rec.shot = null; }
      rec.stream = new MediaStream([vt, rec.audio.dest.stream.getAudioTracks()[0]]);
      if (rec.shot) rec.shot();
      const mr = new MediaRecorder(rec.stream, { mimeType: mime, videoBitsPerSecond: q.video, audioBitsPerSecond: q.audio });
      mr.ondataavailable = (e) => {
        if (!e.data || !e.data.size || rec.dead) return;
        for (let o = 0; o < e.data.size; o += PIECE) rec.queue.push(e.data.size > PIECE ? e.data.slice(o, o + PIECE) : e.data);
        if (!rec.stopping && rec.queue.length > QUEUE_MAX) { fatal('인터넷이 느려 녹화를 서버로 보내지 못하고 있어 멈췄습니다. 지금까지 올라간 부분은 저장됩니다.'); return; }
        pump();
      };
      mr.onerror = (e) => { console.error('[rec]', e.error || e); fatal('녹화 중 문제가 생겨 멈췄습니다. 지금까지 녹화한 부분은 저장됩니다.'); };
      rec.mr = mr;
      startTicks(Math.round(1000 / q.fps));
      mr.start(SLICE_MS);
    } catch (e) {
      console.error('[rec]', e);
      teardown();
      API.del('/recordings/' + rec.id).catch(() => {});
      rec.id = 0;
      throw new App.ApiError(0, { error: '이 브라우저에서 녹화를 시작하지 못했습니다. Chrome 또는 Edge 최신 버전을 써 주세요.' });
    }
    rec.on = true; rec.startedAt = Date.now(); rec.host = !!R.room.host;
    R.send({ t: 'rec', on: true });
    paint();
    toast('녹화를 시작했습니다. 참가자 화면에 "녹화 중"이 표시됩니다.', 'ok', 4500);
  };
  rec.stop = async function (why) {
    if (!rec.on || rec.stopping) return;
    rec.stopping = true;
    const id = rec.id, sid = rec.sid, started = rec.startedAt;
    paint();
    try {
      await new Promise((res) => {
        const mr = rec.mr;
        if (!mr || mr.state === 'inactive') { res(); return; }
        mr.addEventListener('stop', () => res(), { once: true });       // 마지막 조각이 나온 뒤에 온다
        try { mr.stop(); } catch (e) { res(); }
        setTimeout(res, 5000);
      });
      stopTicks();
      await drain();
      let size = rec.sent;
      if (rec.demo) { const blob = new Blob(rec.demo, { type: rec.mime.split(';')[0] }); size = blob.size; DEMO().recPut(id, blob); }
      await API.post('/recordings/' + id + '/finish', { duration_sec: Math.max(1, Math.round((Date.now() - started) / 1000)), size });
      if (why !== 'fatal') toast(DEMO() ? '녹화를 저장했습니다. 수업 정보의 "녹화"에서 볼 수 있습니다.' : '녹화를 저장했습니다. 정리가 끝나면 수업 정보의 "녹화"에 나타납니다.', 'ok', 6000);
    } catch (e) {
      toast('녹화를 마감하지 못했습니다. 올라간 부분은 몇 분 뒤 자동으로 저장됩니다.', 'bad', 8000);
    } finally {
      teardown();
      Object.assign(rec, { on: false, stopping: false, id: 0, demo: null, queue: [] });
      const R = App.room;
      if (R && R.active && R.sid === sid) R.send({ t: 'rec', on: false });
      paint();
      if (!(R && R.active) && /^\/sessions\//.test(App.state.route.path)) App.refresh();     // 수업 정보로 돌아와 있으면 목록에 바로 보이게
    }
  };
  // 강의실을 나갈 때: 녹화 중이면 멈추고, 남은 조각은 화면을 옮긴 뒤에도 계속 올린다.
  rec.leave = function () {
    clearInterval(rec.uiTimer);
    rec.others = [];
    if (rec.on) rec.stop('leave');
  };

  on('room.rec', async () => {
    const R = App.room;
    if (rec.stopping) return;
    if (rec.on) {
      if (await ask({ title: '녹화 중지', message: '녹화를 멈출까요?', detail: '지금까지 녹화한 내용이 저장됩니다. 다시 누르면 새 녹화로 이어서 남길 수 있습니다.', yes: '녹화 중지' })) await rec.stop('user');
      return;
    }
    if (!rec.supported()) { toast('이 브라우저에서는 녹화를 쓸 수 없습니다. Chrome 또는 Edge 를 써 주세요.', 'bad', 6000); return; }
    if (R.session.status !== 'live') { toast('수업이 시작된 뒤에 녹화할 수 있습니다.', 'info'); return; }
    const also = rec.others.length ? names(rec.others) + ' 님도 녹화하고 있습니다. 내 화면은 따로 녹화됩니다. ' : '';
    const detail = R.room.host
      ? also + '참가자 모두의 화면에 "녹화 중"이 표시됩니다. 녹화하는 동안 이 탭을 닫지 마세요. 녹화본은 수업 정보의 "녹화"에서 다시 볼 수 있습니다.'
      : also + '내 화면에 보이는 수업이 녹화되고, 참가자 모두의 화면에 "녹화 중"이 표시됩니다. 녹화본은 나와 담당 컨설턴트만 볼 수 있습니다. 녹화하는 동안 이 화면을 닫지 마세요.';
    if (!(await ask({ title: '수업 녹화', message: '이 수업을 녹화할까요?', detail, yes: '녹화 시작' }))) return;
    await rec.start();
  });

  // 녹화 중에 탭을 닫으려 하면 한 번 묻고, 그래도 닫으면 서버에 마감을 알린다(마지막 몇 초는 빠질 수 있다).
  window.addEventListener('beforeunload', (e) => { if (rec.on && !rec.demo) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('pagehide', () => {
    if (!rec.on || rec.demo || !rec.id) return;
    try {
      fetch('/api/recordings/' + rec.id + '/finish', {
        method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + API.token },
        body: JSON.stringify({ duration_sec: Math.round((Date.now() - rec.startedAt) / 1000) })
      });
    } catch (e) { /* 서버가 몇 분 뒤 자동으로 마감한다 */ }
  });
})(window.App);

;

/*
 * 시작: 저장된 로그인으로 복귀하고 첫 화면을 그린다. 미리보기에서는 예시 관리자 계정으로 바로 들어간다.
 */
(function (App) {
  'use strict';
  const { html, $, setHTML, empty, toast } = App;

  async function start() {
    const demo = App.DEMO();
    if (!demo) App.theme.apply();
    try {
      if (demo) App.session.start(await demo.loginAs('admin'), false);
      else await App.session.restore();
    } catch (e) {
      document.body.dataset.layout = 'bare';
      setHTML($('#app'), html`<div id="bare" class="bare"><div class="bare-msg">${empty('alert', '서버에 연결하지 못했습니다', e.message || '', html`<button class="btn btn-primary" type="button" data-act="app.boot">다시 시도</button>`)}</div></div>`);
      return;
    }
    App.resetShell();
    App.render();
    if (demo) setTimeout(() => toast('예시 데이터로 만든 미리보기입니다. 메뉴 위쪽(휴대폰은 더보기)에서 역할을 바꿔 볼 수 있습니다.', 'info', 6500), 700);
  }
  App.on('app.boot', start);
  start();
})(window.App);

</script>
</body>
</html>
