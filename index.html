<style>
/*
 * 빅링커 라이브 LMS 화면 스타일.
 * 배치: 왼쪽에 남색 띠 하나(로고와 글자 메뉴), 오른쪽은 흰 종이. 좁은 화면에서는 띠가 위로 올라가고 메뉴는 아래쪽 글자 탭이 된다. 시간표와 출석부처럼 굵은 줄과 숫자로 구분하고 상자는 쓰지 않는다.
 * 강조는 한 곳에만 둔다: 남색 바탕의 "다음 수업"과 노란 입장 단추. 둥근 알약 모양은 로고의 고리에서 따온 것으로, 주 단추에만 쓴다.
 * 색은 전부 아래 토큰에서 가져온다. 밝은 화면 값을 :root 에 두고 어두운 화면은 같은 이름을 다시 정의한다. 강의실(--stage-*)은 늘 어둡다.
 */
:root {
  --bg: #ffffff; --fill: #f1f2f5; --line: #d9dce4; --line-2: #a4abbb;
  --ink: #131b2e; --ink-2: #4d566b; --ink-3: #6b7387;
  --head: #132143;
  --block: #132143; --on-block: #ffffff; --on-block-2: #b3bcd8; --on-block-line: rgba(255, 255, 255, .2);
  --yellow: #ffd200; --yellow-2: #f2c200; --on-yellow: #132143; --yellow-soft: #fff4bf;
  --red: #c92a1c; --red-soft: #fde8e4; --green: #1a7449; --amber: #955600;
  --focus: #1f4fd8;
  --c-navy: #2b3f7a; --c-teal: #0d7a80; --c-amber: #b06f00; --c-rose: #c13a67; --c-violet: #6748c4; --c-green: #2b8448;
  --shadow: 0 2px 4px rgba(19, 27, 46, .08), 0 16px 40px rgba(19, 27, 46, .16);
  --overlay: rgba(10, 15, 30, .55);
  --stage: #0b0e17; --stage-2: #161b2a; --stage-3: #232a42; --stage-line: #2c3450; --stage-ink: #eef0f6; --stage-ink-2: #a3abc0;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "Barlow Condensed", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --gutter: 36px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1322; --fill: #182036; --line: #2a3350; --line-2: #55607f;
    --ink: #eceff6; --ink-2: #b3bace; --ink-3: #8f98ae;
    --head: #ffffff;
    --block: #1c2748; --on-block: #ffffff; --on-block-2: #b3bcd8;
    --yellow: #ffd200; --yellow-2: #ffe04d; --on-yellow: #132143; --yellow-soft: #3a3207;
    --red: #ff7d6e; --red-soft: #3d1b17; --green: #6fd6a4; --amber: #f0b65a;
    --focus: #8fb0ff;
    --c-navy: #8fa3ee; --c-teal: #45c0c6; --c-amber: #e7a93a; --c-rose: #f07fa5; --c-violet: #a994f2; --c-green: #67c487;
    --shadow: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .55);
    --overlay: rgba(0, 0, 0, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1322; --fill: #182036; --line: #2a3350; --line-2: #55607f;
  --ink: #eceff6; --ink-2: #b3bace; --ink-3: #8f98ae;
  --head: #ffffff;
  --block: #1c2748; --on-block: #ffffff; --on-block-2: #b3bcd8;
  --yellow: #ffd200; --yellow-2: #ffe04d; --on-yellow: #132143; --yellow-soft: #3a3207;
  --red: #ff7d6e; --red-soft: #3d1b17; --green: #6fd6a4; --amber: #f0b65a;
  --focus: #8fb0ff;
  --c-navy: #8fa3ee; --c-teal: #45c0c6; --c-amber: #e7a93a; --c-rose: #f07fa5; --c-violet: #a994f2; --c-green: #67c487;
  --shadow: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .55);
  --overlay: rgba(0, 0, 0, .66);
  color-scheme: dark;
}

/* ---------- 기본 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.65 var(--font); overflow: hidden; word-break: keep-all; }
h1, h2, h3, p, ul, ol, dl, dd, figure, fieldset, pre { margin: 0; }
ul, ol { padding: 0; list-style: none; }
fieldset { border: 0; padding: 0; min-width: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, video, canvas { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { flex: none; }
.grow { flex: 1 1 auto; min-width: 0; }
.only-sm { display: none; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.c-navy { --c: var(--c-navy); } .c-teal { --c: var(--c-teal); } .c-amber { --c: var(--c-amber); }
.c-rose { --c: var(--c-rose); } .c-violet { --c: var(--c-violet); } .c-green { --c: var(--c-green); }

/* ---------- 뼈대: 왼쪽 띠(메뉴) + 본문 ---------- */
#app { height: 100%; }
body[data-layout="app"] #app { display: grid; grid-template-columns: 212px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.bare { height: 100%; overflow-y: auto; }
.gnb { display: flex; flex-direction: column; gap: 28px; min-width: 0; min-height: 0; overflow-y: auto; padding: 26px 0 20px env(safe-area-inset-left, 0px); background: var(--block); color: var(--on-block); }
.brand { display: flex; align-items: center; gap: 9px; flex: none; padding: 0 24px; }
.brand-logo { height: 20px; width: auto; }
.brand-tag { font: 700 15px/1 var(--num); letter-spacing: .14em; color: var(--yellow); padding-top: 2px; }
.menu { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.menu a { display: flex; align-items: center; min-height: 44px; padding: 8px 24px; color: var(--on-block-2); font-size: 15.5px; font-weight: 500; white-space: nowrap; box-shadow: inset 4px 0 0 transparent; transition: color .12s; }
.menu a:hover { color: var(--on-block); }
.menu a.is-on { color: var(--on-block); font-weight: 700; box-shadow: inset 4px 0 0 var(--yellow); }
.bar-r { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; flex: none; margin: 0 24px; padding-top: 18px; border-top: 1px solid var(--on-block-line); }
.who { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; min-width: 0; max-width: 100%; }
.who b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; } .who small { font-size: 12.5px; color: var(--on-block-2); }
.who:hover b { text-decoration: underline; text-underline-offset: 3px; }
.bar-btn { border: 0; background: none; padding: 2px 0; color: var(--on-block-2); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.bar-btn:hover { color: var(--on-block); }
.gnb .pv { flex-direction: column; align-items: flex-start; gap: 6px; }
.gnb .pv .seg { flex-wrap: nowrap; }
.gnb .pv .seg button { padding: 2px 6px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
.phead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding: 30px max(var(--gutter), env(safe-area-inset-right, 0px)) 6px max(var(--gutter), env(safe-area-inset-left, 0px)); }
.top-l { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.top-t { min-width: 0; }
.top-t h1 { font-size: 28px; font-weight: 900; line-height: 1.3; letter-spacing: -.02em; color: var(--head); text-wrap: balance; }
.top-t p { margin-top: 2px; color: var(--ink-2); font-size: 14px; }
.top-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.back { align-self: flex-start; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.back:hover { color: var(--head); text-decoration: underline; }
.view { flex: 1; min-height: 0; overflow-y: auto; outline: none; }
.view-in { display: flex; flex-direction: column; gap: 36px; max-width: 1240px; padding-block: 22px 72px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.view-narrow { max-width: 880px; }
.tabbar { display: none; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; align-items: start; }
.col-main, .col-side { display: flex; flex-direction: column; gap: 40px; min-width: 0; }

/* 미리보기 표시 (역할 바꿔 보기) */
.pv { display: flex; align-items: center; gap: 10px; }
.pv-t { font-size: 12px; font-weight: 700; color: var(--yellow); white-space: nowrap; }
.pv .seg { gap: 2px; }
.pv .seg button { min-height: 28px; padding: 2px 9px; color: var(--on-block-2); font-size: 13px; border: 1px solid transparent; box-shadow: none; }
.pv .seg button.is-on { color: var(--on-yellow); background: var(--yellow); font-weight: 700; }
.pv-login { flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.pv-login .pv-t { color: var(--ink-2); }
.pv-login .seg button { color: var(--ink); border-color: var(--line-2); }
.pv-drawer { flex-wrap: wrap; margin-bottom: 14px; }
.pv-drawer .pv-t { color: var(--ink-2); } .pv-drawer .seg button { color: var(--ink); border-color: var(--line-2); }

/* ---------- 단추 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 6px 15px; border: 1.5px solid var(--ink); border-radius: 3px; background: transparent; color: var(--ink); font-weight: 700; font-size: 14px; white-space: nowrap; transition: background-color .12s, color .12s, transform .08s; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn.is-busy { opacity: .5; cursor: default; pointer-events: none; }
.btn .ic { display: none; }
.btn-primary, .btn-go { border-color: var(--yellow); border-radius: 999px; background: var(--yellow); color: var(--on-yellow); padding-inline: 20px; }
.btn-primary:hover, .btn-go:hover { background: var(--yellow-2); border-color: var(--yellow-2); color: var(--on-yellow); }
.btn-danger { border-color: var(--red); background: var(--red); color: #fff; }
.btn-danger:hover { background: var(--red); color: #fff; filter: brightness(1.1); }
.btn-danger-ghost { border-color: transparent; color: var(--red); padding-inline: 6px; text-decoration: underline; text-underline-offset: 3px; }
.btn-danger-ghost:hover { background: transparent; color: var(--red); text-decoration-thickness: 2px; }
.btn-sm { min-height: 30px; padding: 3px 11px; font-size: 13px; }
.btn-sm.btn-go, .btn-sm.btn-primary { padding-inline: 14px; }
.btn-lg { min-height: 50px; padding: 10px 28px; font-size: 16px; }
.btn-block { width: 100%; }
.btn-group { display: inline-flex; align-items: center; }
.btn-group .btn { border-radius: 0; margin-left: -1.5px; padding-inline: 12px; }
.btn-group .btn:first-child { margin-left: 0; }
.btn-group .btn .ic { display: block; }
.btn-label { display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border-block: 1.5px solid var(--ink); font: 700 18px/1 var(--num); white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; border: 0; border-radius: 3px; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--fill); color: var(--ink); }
.icon-sm { width: 28px; height: 28px; }
.linklike { border: 0; background: none; padding: 0; text-align: left; }
.more { font-size: 13px; font-weight: 700; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.more:hover, .linklike:hover { color: var(--head); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px 20px; }
.seg button { display: inline-flex; align-items: baseline; gap: 5px; min-height: 34px; padding: 4px 0; border: 0; background: transparent; color: var(--ink-3); font-weight: 500; white-space: nowrap; box-shadow: inset 0 -2px 0 transparent; }
.seg button:hover { color: var(--ink); }
.seg button.is-on { color: var(--head); font-weight: 700; box-shadow: inset 0 -2px 0 var(--head); }
.seg small, .tabs small { font: 600 14px/1 var(--num); color: var(--ink-3); }
.seg-full { display: flex; }

/* ---------- 입력 ---------- */
.form { display: flex; flex-direction: column; gap: 16px; }
.form-wide { gap: 34px; }
.form h2 { font-size: 24px; font-weight: 900; letter-spacing: -.02em; color: var(--head); }
.form fieldset { display: flex; flex-direction: column; gap: 14px; }
.form legend { width: 100%; padding: 0 0 8px; margin-bottom: 14px; border-bottom: 2px solid var(--head); font-size: 15px; font-weight: 700; color: var(--head); }
.form-end { display: flex; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-l { font-size: 13px; font-weight: 700; color: var(--ink); }
.hint { font-size: 13px; color: var(--ink-3); line-height: 1.6; }
.hint a { color: var(--head); text-decoration: underline; text-underline-offset: 3px; }
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea { width: 100%; min-height: 40px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 3px; background: var(--bg); color: var(--ink); }
textarea { resize: vertical; line-height: 1.65; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
input[disabled] { background: var(--fill); color: var(--ink-3); }
::placeholder { color: var(--ink-3); opacity: 1; }
.sel { width: auto; max-width: 100%; }
.sel-sm { width: auto; min-height: 32px; padding: 3px 8px; font-size: 13.5px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.span2 { grid-column: 1 / -1; }
.check { display: flex; align-items: flex-start; gap: 9px; min-height: 28px; cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 4px 0 0; flex: none; accent-color: var(--head); }
.check small { color: var(--ink-3); margin-left: 6px; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 18px; max-height: 320px; overflow-y: auto; }
.swatches { display: flex; gap: 10px; }
.swatches label { position: relative; cursor: pointer; }
.swatches input { position: absolute; opacity: 0; inset: 0; }
.swatches i { display: block; width: 28px; height: 28px; background: var(--c); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line-2); }
.swatches input:checked + i { box-shadow: 0 0 0 2px var(--ink); }
.swatches input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 3px; }
.search { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 240px; max-width: 380px; padding: 0 10px; border-bottom: 2px solid var(--head); color: var(--ink-3); }
.search input { border: 0 !important; padding-inline: 0 !important; outline: 0 !important; background: transparent !important; }
.search:focus-within { border-bottom-color: var(--focus); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 26px 16px; border: 1.5px dashed var(--line-2); color: var(--ink-3); text-align: center; cursor: pointer; }
.drop:hover { background: var(--fill); }
.drop .ic { display: none; }
.drop b { color: var(--ink); font-weight: 700; word-break: break-all; text-decoration: underline; text-underline-offset: 3px; }
.drop span { font-size: 13px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 2px solid var(--focus); }
.progress { position: relative; height: 24px; background: var(--fill); overflow: hidden; }
.progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--yellow); transition: width .15s; }
.progress span { position: relative; display: block; text-align: center; font-size: 12.5px; line-height: 24px; font-weight: 700; color: var(--ink); }
.copybox { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }

/* ---------- 상태 표시: 알약 대신 글자와 기호 ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 2px; color: var(--ink-2); font-size: 12px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
.chip-ok { border-color: var(--green); color: var(--green); }
.chip-warn { border-color: var(--amber); color: var(--amber); }
.chip-bad { border-color: var(--red); color: var(--red); }
.chip-muted { border-color: var(--line); color: var(--ink-3); }
.chip-brand { border-color: var(--head); color: var(--head); }
.chip-live { border: 0; padding: 0; color: var(--red); font-size: 13.5px; }
.chip-live .dot { width: 8px; height: 8px; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.st { font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.st-live { color: var(--red); font-weight: 700; }
.st-live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
.st-off { color: var(--ink-3); }
.st-cancel { color: var(--ink-3); text-decoration: line-through; }
/* 출석 기호: ○ 출석 △ 지각 × 결석 공 인정결석 */
.am { display: inline-flex; align-items: baseline; gap: 5px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.am i { font-style: normal; font-size: 16px; line-height: 1; }
.am-present { color: var(--ink); } .am-late { color: var(--amber); } .am-absent { color: var(--red); } .am-excused, .am-none { color: var(--ink-3); }
.cdot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: var(--c); }
.cbar { flex: none; width: 12px; height: 12px; background: var(--c); }
.sep { display: inline-block; width: 1px; height: 11px; margin: 0 9px; background: var(--line-2); vertical-align: -1px; }
.avatar { display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; background: var(--fill); color: var(--head); font-weight: 900; font-size: 14px; }
.av-sm { display: none; }
.av-lg { width: 64px; height: 64px; font-size: 26px; background: var(--block); color: var(--on-block); }
.av-xl { width: 88px; height: 88px; font-size: 34px; background: var(--stage-3); color: var(--stage-ink); }
.meta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-3); }
.meta .ic { display: none; }
.none { color: var(--ink-3); font-size: 14px; padding: 10px 0; }
.lead { color: var(--ink-2); max-width: 68ch; font-size: 15.5px; }
.bar { display: inline-block; width: 64px; height: 5px; background: var(--line); overflow: hidden; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--head); }
.bar-ok i { background: var(--head); }
.ticks { display: inline-flex; gap: 3px; align-items: center; }
.ticks i { width: 7px; height: 14px; border: 1.5px solid var(--line-2); }
.ticks i.is-on { background: var(--head); border-color: var(--head); }
.ticks i.is-live { background: var(--yellow); border-color: var(--yellow); }
.kind { flex: none; width: 46px; font: 700 15px/1 var(--num); letter-spacing: .06em; color: var(--ink-2); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 40px 0; color: var(--ink-3); }
.empty .ic { display: none; }
.empty-t { color: var(--head); font-size: 20px; font-weight: 900; letter-spacing: -.01em; }
.empty-d { max-width: 52ch; font-size: 14.5px; color: var(--ink-2); }
.empty .btn { margin-top: 12px; }
.skel { display: flex; flex-direction: column; gap: 16px; padding: 8px 0; }
.skel-l { height: 14px; background: linear-gradient(90deg, var(--fill) 25%, var(--line) 37%, var(--fill) 63%); background-size: 400% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.banner { display: flex; gap: 8px; align-items: flex-start; padding: 12px 14px; font-size: 14px; font-weight: 500; }
.banner .ic { display: none; }
.banner-bad { background: var(--red-soft); color: var(--red); }
.prose { color: var(--ink); max-width: 68ch; line-height: 1.8; overflow-wrap: anywhere; }
.sub { margin: 22px 0 6px; font-size: 13px; font-weight: 700; color: var(--head); }
.row.is-wait .row-t, .row.is-wait .row-when b { color: var(--ink-3); }
.legend { font-size: 13px; color: var(--ink-2); }
.legend b { margin: 0 4px 0 14px; font-size: 15px; color: var(--ink); } .legend b:first-child { margin-left: 0; }

/* ---------- 구역 ---------- */
.sec { display: flex; flex-direction: column; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--head); }
.sec-h h2 { font-size: 15px; font-weight: 700; color: var(--head); }
.sec > .none, .sec > .att, .sec > .form, .sec > .prose, .sec > .facts { margin-top: 14px; }
/* 운영 숫자: 상자 없이 큰 숫자를 한 줄로 */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 22px 36px; padding-top: 16px; border-top: 2px solid var(--head); }
.kpi { min-width: 0; }
.kpi dt { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.kpi dd { font: 700 48px/1.05 var(--num); color: var(--head); font-variant-numeric: tabular-nums; }
.kpi dd small { margin-left: 4px; font: 500 14px/1 var(--font); color: var(--ink-2); }
.kpi dd a:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
.kpi p { font-size: 13px; color: var(--ink-3); }
.kpi.is-warn dd { color: var(--red); }

/* 다음 수업: 이 화면에서 단 하나의 색 면 */
.next { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 34px; align-items: center; padding: 28px 34px; background: var(--block); color: var(--on-block); }
.next.is-empty { display: block; padding: 22px 26px; background: var(--fill); color: var(--ink-2); }
.next-when { display: flex; flex-direction: column; align-items: flex-start; font-size: 14px; color: var(--on-block-2); }
.next-when b { font: 700 68px/1 var(--num); color: var(--yellow); font-variant-numeric: tabular-nums; }
.next.is-live .next-when span:first-child { color: var(--on-block); font-weight: 700; }
.next-what { min-width: 0; }
.next-c, .next-m { font-size: 14px; color: var(--on-block-2); }
.next-c .cdot { background: var(--on-block-2); }
.next-c .sep, .next-m .sep { background: var(--on-block-2); opacity: .5; }
.next-what h2 { margin: 2px 0; font-size: 24px; font-weight: 700; line-height: 1.4; letter-spacing: -.01em; text-wrap: balance; }
.next-what h2 a:hover { text-decoration: underline; text-underline-offset: 4px; }
.next-go { display: flex; align-items: center; gap: 18px; }
.next-in { font: 600 22px/1 var(--num); color: var(--on-block); white-space: nowrap; }
.next .chip-live { color: var(--on-block); font: 600 20px/1 var(--num); }
.next .chip-live .dot { background: var(--red); }
.next .btn-go { min-height: 50px; padding-inline: 30px; font-size: 16px; }
.join-wait { font-size: 13px; color: var(--ink-3); white-space: nowrap; }

/* 오늘 시간표 */
.rail { display: flex; flex-direction: column; }
.rail-i { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.rail-i time { font: 700 26px/1 var(--num); color: var(--head); font-variant-numeric: tabular-nums; }
.rail-dot { display: none; }
.rail-i.is-past time, .rail-i.is-past .row-t { color: var(--ink-3); }
.rail-now { display: flex; align-items: center; gap: 10px; padding: 3px 10px; background: var(--yellow); color: var(--on-yellow); font: 700 15px/1.4 var(--num); letter-spacing: .02em; }

/* 목록 */
.rows { display: flex; flex-direction: column; border-top: 2px solid var(--head); }
.sec > .rows, .sec > .rail { border-top: 0; }
.row { display: flex; align-items: center; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.rows-tight .row { padding-block: 10px; gap: 12px; }
.rows-lg .row { padding-block: 18px; }
.row.is-off .row-t, .rail-i.is-off .row-t { text-decoration: line-through; color: var(--ink-3); }
.row-when { flex: none; width: 112px; display: flex; flex-direction: column; line-height: 1.35; }
.row-when b { font-weight: 700; }
.row-when span { font: 500 17px/1.2 var(--num); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row-when b.num { font: 700 22px/1.1 var(--num); color: var(--head); }
.rows-tight .row-when { width: 58px; }
.rows-tight .row-when span { font: 400 12.5px/1.3 var(--font); }
.row-ic { display: none; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-t { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows-lg .row-t { font-size: 18px; letter-spacing: -.01em; }
a.row-t:hover { text-decoration: underline; text-underline-offset: 3px; }
.row-s { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-end { flex: none; display: flex; align-items: center; gap: 14px; }
.row-prog { flex: none; display: flex; align-items: center; gap: 10px; color: var(--ink-2); width: 190px; }
.row-prog .num { font-size: 17px; font-weight: 600; }
.row-next { width: 180px; justify-content: flex-end; }
.plain { display: flex; flex-direction: column; }
.plain li { display: flex; flex-direction: column; gap: 1px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.plain a { font-weight: 700; overflow-wrap: anywhere; } .plain a:hover { text-decoration: underline; text-underline-offset: 3px; }
.plain a .ic { display: none; }
.log li { display: grid; grid-template-columns: 62px auto minmax(0, 1fr); gap: 0 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: baseline; }
.log time { color: var(--ink-3); font-size: 12.5px; }
.log b { font-weight: 700; } .log span { color: var(--ink-2); }
.log em { grid-column: 2 / -1; font-style: normal; color: var(--ink-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log em:empty { display: none; }

/* 출석 요약 */
.att { display: flex; flex-direction: column; gap: 10px; }
.att-rate { font-size: 15px; color: var(--ink-2); }
.att-rate b { font: 700 60px/1 var(--num); color: var(--head); font-variant-numeric: tabular-nums; }
.att-rate small { margin-left: 10px; font-size: 13.5px; color: var(--ink-2); }
.att .bar { display: none; }
.att-n { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.att-n div { display: flex; align-items: baseline; gap: 6px; }
.att-n dt { font-size: 13px; color: var(--ink-2); }
.att-n dd { font: 700 22px/1 var(--num); color: var(--ink); }
.att-wide { flex-direction: row; align-items: flex-end; gap: 40px; flex-wrap: wrap; margin: 14px 0 22px; }

/* 표: 출석부처럼 위에 굵은 줄, 칸막이는 가는 줄 */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; border-top: 2px solid var(--head); font-size: 14px; }
.sec > .tbl-wrap .tbl { border-top: 0; }
.tbl th { padding: 9px 14px 9px 0; text-align: left; font-size: 12.5px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tfoot td { font-weight: 700; border-top: 2px solid var(--head); border-bottom: 0; }
.tbl .num { text-align: right; font-size: 18px; font-weight: 600; white-space: nowrap; }
.tbl th.num { font: 700 12.5px/1.6 var(--font); }
.tbl .rate { white-space: nowrap; font: 600 18px/1 var(--num); }
.tbl .rate .bar { margin-right: 10px; }
.tbl .clip { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl a { font-weight: 700; } .tbl a:hover { text-decoration: underline; text-underline-offset: 3px; }
.tbl tr.is-off td { color: var(--ink-3); }
.sel-sm.att-late { color: var(--amber); } .sel-sm.att-absent { color: var(--red); } .sel-sm.att-excused, .sel-sm.att-none { color: var(--ink-3); }
/* 출석부 (수강생 × 회차) */
/* 출석부는 내용 너비만큼만 차지한다. 회차가 적을 때 합계 칸이 멀리 벌어지지 않게. */
.reg { width: auto; min-width: min(100%, 560px); }
.reg th, .reg td { padding-right: 0; }
.reg td.num, .reg th.num { width: 68px; }
.reg .reg-n { position: sticky; left: 0; z-index: 1; min-width: 132px; padding-right: 18px; background: var(--bg); text-align: left; font-size: 14px; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--line); }
.reg thead .reg-n { font-size: 12.5px; color: var(--ink-2); border-bottom-color: var(--line-2); }
.reg .reg-n small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); }
.reg-s { width: 46px; min-width: 46px; text-align: center !important; padding-inline: 0 !important; }
.reg-s a { display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-weight: 400; }
.reg-s b { font: 700 18px/1 var(--num); color: var(--head); }
.reg-s span { font: 500 13px/1.2 var(--num); color: var(--ink-3); }
.reg-s.is-live b { background: var(--yellow); color: var(--on-yellow); padding: 0 5px; }
.reg-c { text-align: center; font-size: 17px; font-weight: 700; border-left: 1px solid var(--line); }
.reg-c.am-late { color: var(--amber); } .reg-c.am-absent { color: var(--red); background: var(--red-soft); } .reg-c.am-excused { font-size: 13px; color: var(--ink-2); } .reg-c.am-none { color: var(--line-2); }
.reg .num:first-of-type { border-left: 2px solid var(--head); }
.reg td.num, .reg th.num { padding-left: 14px; }

/* 탭 · 접기 */
.tabs { display: flex; gap: 26px; box-shadow: inset 0 -1px 0 var(--line-2); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { display: inline-flex; align-items: baseline; gap: 6px; min-height: 44px; padding: 8px 0; border: 0; background: none; color: var(--ink-3); font-size: 16px; font-weight: 500; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.is-on { color: var(--head); font-weight: 700; box-shadow: inset 0 -3px 0 var(--head); }
.tabs-sm { gap: 18px; } .tabs-sm button { min-height: 38px; padding: 6px 0; font-size: 14px; }
.fold > summary { display: flex; align-items: center; gap: 8px; padding: 14px 0; cursor: pointer; font-weight: 700; color: var(--ink-2); list-style: none; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "펼치기"; margin-left: auto; font-size: 12.5px; font-weight: 500; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; }
.fold[open] > summary::after { content: "접기"; }
.fold > .rows { border-top: 1px solid var(--line-2); }
.folds { display: flex; flex-direction: column; border-top: 2px solid var(--head); }
.fold-card { border-bottom: 1px solid var(--line); }
.fold-card > summary { padding: 16px 0; color: var(--ink); flex-wrap: wrap; }
.fold-card > summary b { font-size: 17px; letter-spacing: -.01em; }
.fold-card > summary::after { order: 3; margin-left: 14px; }
.fold-card > summary .meta { margin-left: auto; }
.fold-card .prose { padding: 0 0 18px; }
.fold-f { display: flex; gap: 8px; padding: 0 0 18px; }
.pinmark { font-size: 12px; font-weight: 700; color: var(--on-yellow); background: var(--yellow); padding: 0 6px; }
.pinmark .ic { display: none; } .pinmark::after { content: "고정"; }

/* 회차 머리 */
.shead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; padding-bottom: 20px; border-bottom: 2px solid var(--head); }
.shead-d { font-size: 15px; color: var(--ink-2); display: flex; flex-direction: column; }
.shead-d b { font: 700 58px/1.05 var(--num); color: var(--head); font-variant-numeric: tabular-nums; }
.shead-m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; margin-top: 8px; font-size: 14px; color: var(--ink-2); }
.shead-m > span + span::before { content: ""; display: inline-block; width: 1px; height: 11px; margin: 0 10px; background: var(--line-2); }
.shead-m .ic { display: none; }
.shead-r { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.shead-r .btn-go { min-height: 50px; padding-inline: 30px; font-size: 16px; }

/* 사용자 카드 */
.ucard { display: flex; gap: 24px; align-items: flex-start; padding-bottom: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 32px; flex: 1; min-width: 0; }
.facts dt { font-size: 12.5px; color: var(--ink-2); } .facts dd { font-weight: 700; overflow-wrap: anywhere; }
.facts small { color: var(--ink-3); font-weight: 400; }
.cred { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; padding: 16px; background: var(--fill); }
.cred dt { font-size: 12.5px; color: var(--ink-2); } .cred dd { font-weight: 700; overflow-wrap: anywhere; }
.cred code { font: 700 19px/1.4 ui-monospace, Consolas, monospace; letter-spacing: .04em; user-select: all; }

/* ---------- 메모 ---------- */
.notes { display: flex; flex-direction: column; }
.note { padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.sec > .notes, #sess-notes { margin-top: 0; }
.note-h { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13px; color: var(--ink-3); }
.note-h b { color: var(--ink); } .note-h time { white-space: nowrap; }
.note-src { color: var(--ink-2); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-decoration: underline; text-underline-offset: 3px; }
.ref { flex: none; padding: 0 7px; border: 0; background: var(--yellow); color: var(--on-yellow); font: 700 15px/1.5 var(--num); }
.note-b { margin-top: 4px; line-height: 1.75; overflow-wrap: anywhere; }
.note-st { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
.note-st .ic { display: none; }
.note-r { margin-top: 10px; padding: 2px 0 2px 14px; border-left: 3px solid var(--head); }
.note-r b { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--head); }
.note-r b .ic { display: none; }
.note-r p { margin-top: 2px; line-height: 1.7; overflow-wrap: anywhere; }
.note-reply { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; margin-top: 10px; }
.note-form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.note-form-f { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.note-form .check { font-size: 13.5px; color: var(--ink-2); }
.note-form .check b { font-family: var(--num); font-size: 15px; }

/* ---------- 자료 보기 ---------- */
.viewer { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; min-height: 0; border-top: 1px solid var(--line); }
.vmain { min-width: 0; min-height: 0; overflow: auto; padding: 18px max(var(--gutter), env(safe-area-inset-left, 0px)); background: var(--fill); display: flex; flex-direction: column; gap: 12px; }
.vmain-in { padding: 0; background: transparent; max-height: 62vh; }
.vside { min-width: 0; overflow-y: auto; padding: 18px max(24px, env(safe-area-inset-right, 0px)) 40px 24px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.vside-h { padding-bottom: 8px; border-bottom: 2px solid var(--head); font-size: 15px; font-weight: 700; color: var(--head); }
.vdesc { color: var(--ink-2); font-size: 14px; }
.pdf-bar { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 2; }
.pdf-bar .btn { background: var(--bg); }
.pdf-bar .btn:hover { background: var(--ink); }
.pdf-pos { display: inline-flex; align-items: center; min-height: 30px; padding: 0 14px; border-block: 1.5px solid var(--ink); background: var(--bg); font: 700 17px/1 var(--num); }
.pdf-box { flex: none; overflow-x: auto; overflow-y: hidden; text-align: center; padding-bottom: 4px; }
.pdf-box canvas { max-width: none; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
.imgbox { text-align: center; } .imgbox img { background: var(--bg); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
.media { width: 100%; max-height: 70vh; background: var(--stage); }
.doc { padding: 32px 36px; background: var(--bg); white-space: pre-wrap; overflow-wrap: anywhere; font: 400 15.5px/1.9 var(--font); max-width: 78ch; align-self: center; width: 100%; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.embed { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: var(--stage); overflow: hidden; }
.embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.filecard { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: auto; padding: 36px; max-width: 480px; width: 100%; background: var(--bg); color: var(--ink-2); }
.filecard .ic { display: none; }
.filecard b { color: var(--head); font-size: 20px; font-weight: 900; overflow-wrap: anywhere; }
.url { font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; user-select: all; }

/* ---------- 달력 ---------- */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; }
.cal { border-top: 2px solid var(--head); }
.cal-h { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12.5px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line-2); }
.cal-h span { padding: 8px 6px; } .cal-h .is-sun { color: var(--red); }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-c { display: flex; flex-direction: column; gap: 4px; min-height: 104px; padding: 6px; border: 0; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); background: transparent; text-align: left; min-width: 0; }
.cal-c:nth-child(7n + 1) { border-left: 0; }
.cal-c:hover { background: var(--fill); }
.cal-c b { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 4px; align-self: flex-start; font: 600 18px/1 var(--num); }
.cal-c.is-other b { color: var(--line-2); }
.cal-c.is-today b { background: var(--yellow); color: var(--on-yellow); font-weight: 700; }
.cal-c.is-sel { box-shadow: inset 0 0 0 2px var(--head); }
.cal-ev { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-ev i { display: block; padding-left: 6px; border-left: 3px solid var(--c); font-style: normal; font-size: 12px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.cal-ev i em { font: 700 14px/1 var(--num); font-style: normal; color: var(--ink); }
.cal-ev i.is-off { text-decoration: line-through; opacity: .55; }
.cal-ev small { font-size: 11.5px; color: var(--ink-3); }
.cal-day { display: flex; flex-direction: column; min-width: 0; }

/* ---------- 모달 · 서랍 · 알림 ---------- */
#layer { position: relative; z-index: 50; }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--overlay); animation: fade .14s ease-out; overflow-y: auto; }
.overlay-side { place-items: stretch end; padding: 0; }
.modal, .drawer { display: flex; flex-direction: column; width: 100%; max-height: 100%; background: var(--bg); box-shadow: var(--shadow); min-width: 0; }
.modal { max-width: 540px; animation: pop .16s ease-out; }
.modal.is-wide { max-width: 960px; }

  const REC_OPEN_MAX = 6;         // 한 수업에서 동시에 녹화할 수 있는 학생 수 (진행자는 이 수에 들지 않는다)
  const REC_EXT = { 'video/webm': 'webm', 'video/mp4': 'mp4' };

  function createApi(deps) {

    const dayKey = (s) => new Date(ms(s) + KST).toISOString().slice(0, 10);

    const int = (v, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : n; };

    function settings() {

    function clientConfig() {

    function log(u, action, target, detail) {

    // ---------- 접근 권한 ----------
    function myCourseIds(u) {

    function actualMinutes(s) {

    function joinState(s, u) {

      return {

        status: c.status, default_provider: c.default_provider || '', room_mode: c.room_mode || 'mesh',
        created_at: c.created_at, consultant: mini(userOf(c.consultant_id)),

    function viewerOf(m) {

      if (m) return 'https://player.vimeo.com/video/' + m[1] + (m[2] || m[3] ? '?h=' + (m[2] || m[3]) : '');

    function materialVisible(m, u) {

    function materialView(m, u) {

      const v = {
        id: m.id, course_id: m.course_id || null, session_id: m.session_id || null, title: m.title,
        description: m.description || '', kind: m.kind, file_name: m.file_name || '', mime: m.mime || '',

    // 녹화: 과정을 맡은 컨설턴트와 관리자는 모두 본다. 학생은 자기가 녹화한 것과, 준비가 끝났고 수강생에게 공개된 것만 본다.
    const canManageRec = (r, u) => u.role === 'admin' || canManage(u, course(r.course_id));

    const canEditRec = (r, u) => canManageRec(r, u) || ownsRec(r, u);      // 마감·이름 변경·삭제
    function recVisible(r, u) {

    // 이 수업을 녹화해도 되는지. 진행자는 언제나, 학생은 관리자 설정(record_students)에 따라.

      const mode = settings().record_students;
      if (mode === 'off') return { ok: false, why: '학생 녹화는 꺼져 있습니다. 필요하면 컨설턴트에게 요청해 주세요.' };
      if (mode === 'one' && c.kind !== 'one') return { ok: false, why: '학생 녹화는 1:1 수업에서만 할 수 있습니다.' };
      return { ok: true, host: false };
    }
    function recView(r, u) {
      const c = course(r.course_id), s = sess(r.session_id), mine = canManageRec(r, u), by = userOf(r.created_by);
      const v = {
        id: r.id, session_id: r.session_id, course_id: r.course_id, title: r.title || '녹화', status: r.status,
        mime: r.mime || '', size: r.size || 0, duration_sec: r.duration_sec || 0, audience: r.audience === 'staff' ? 'staff' : 'all',
        started_at: r.started_at || r.created_at, ended_at: r.ended_at || null, created_at: r.created_at,
        by: mini(by), by_student: !!by && by.role === 'student', mine: r.created_by === u.id,

        can_manage: mine, can_edit: canEditRec(r, u)

    }
    function visibleRecs(u, filter) {
      filter = filter || {};
      const rows = filter.session_id ? RC.find({ session_id: filter.session_id }) : filter.course_id ? RC.find({ course_id: filter.course_id }) : RC.all();
      return rows.filter((r) => recVisible(r, u)).sort((a, b) => cmp(b.created_at, a.created_at) || b.id - a.id);
    }
    function dropRecs(where) {
      RC.find(where).forEach((r) => { if (recs) recs.remove(r); RC.remove(r.id); });
    }
    function recUsage() {
      const all = RC.all(), ready = all.filter((r) => r.status === 'ready');
      return Object.assign({
        count: ready.length, bytes: ready.reduce((n, r) => n + (r.size || 0), 0), seconds: ready.reduce((n, r) => n + (r.duration_sec || 0), 0),
        active: all.filter((r) => r.status === 'recording' || r.status === 'processing').length
      }, recs && recs.usage ? recs.usage() : {});
    }
    function noteView(n, u) {
      const m = n.material_id ? M.get(n.material_id) : null, s = n.session_id ? sess(n.session_id) : null;
      return {
        id: n.id, user_id: n.user_id, material_id: n.material_id || null, session_id: n.session_id || null,
        course_id: n.course_id || null, ref: n.ref || '', body: n.body, shared: n.shared ? 1 : 0,
        reply: n.reply || '', reply_at: n.reply_at || null, reply_by: n.reply_by ? mini(userOf(n.reply_by)) : null,
        created_at: n.created_at, updated_at: n.updated_at, author: mini(userOf(n.user_id)),

    function noticeView(n, u) {

        created_at: n.created_at, author: mini(userOf(n.author_id)),
        course: c ? { id: c.id, title: c.title, color: c.color || 'navy' } : null,

    }
    function visibleNotices(u) {

        .sort((a, b) => (b.pinned || 0) - (a.pinned || 0) || cmp(b.created_at, a.created_at))
        .map((n) => noticeView(n, u));
    }

    }
    function attSummary(studentId, courseIds) {
      const out = { present: 0, late: 0, absent: 0, excused: 0, total: 0, rate: null, seconds: 0 };
      A.find({ user_id: studentId }).forEach((r) => {
        const s = sess(r.session_id);
        if (!s || s.status === 'canceled') return;
        if (courseIds && courseIds.indexOf(s.course_id) < 0) return;
        if (out[r.status] != null) { out[r.status]++; out.total++; }
        out.seconds += r.seconds || 0;
      });
      const base = out.total - out.excused;
      out.rate = base > 0 ? Math.round(((out.present + out.late) / base) * 100) : null;
      return out;
    }
    function conflicts(consultantId, startIso, durMin, exceptId) {
      const a0 = ms(startIso), a1 = a0 + durMin * 60000;

        .filter((s) => s.id !== exceptId && (s.status === 'scheduled' || s.status === 'live') &&
          ms(s.starts_at) < a1 && ms(s.starts_at) + s.duration_min * 60000 > a0)
        .map((s) => ({ id: s.id, title: s.title, starts_at: s.starts_at, duration_min: s.duration_min, course_title: (course(s.course_id) || {}).title || '' }));
    }
    function consultantStats(t, month) {
      const courses = C.find({ consultant_id: t.id });

      let p = 0, tot = 0;
      ended.forEach((s) => A.find({ session_id: s.id }).forEach((r) => {
        if (r.status === 'excused') return;
        tot++; if (r.status === 'present' || r.status === 'late') p++;
      }));

        courses: courses.filter((c) => c.status === 'open').length,

        scheduled: inMonth.filter((s) => s.status === 'scheduled' || s.status === 'live').length,
        attendance_rate: tot ? Math.round((p / tot) * 100) : null,
        pending_records: all.filter((s) => s.status === 'ended' && !str(s.summary)).length

    }
    function markJoin(s, u, t) {
      const row = A.one({ session_id: s.id, user_id: u.id });
      const late = ms(t) > ms(s.starts_at) + settings().late_minutes * 60000;
      if (!row) {

    }
    const okLang = (c) => (env.langCodes ? env.langCodes.indexOf(c) >= 0 : /^[a-z]{2}$/.test(c));
    function checkPw(pw) { if (String(pw || '').length < 8) bad('비밀번호는 8자 이상으로 정해 주세요.'); }

      keys.forEach((k) => { if (p[k] != null) out[k] = str(p[k], k === 'bio' || k === 'goal' ? 500 : 80); });
      // 사용 언어: 강의실에서 말하는 언어와 자막 언어의 기본값이 된다

    const needCourse = (x) => { const c = course(int(x.params.id)); if (!c) bad('과정을 찾을 수 없습니다.', 404); return c; };
    const needSession = (x) => { const s = S.get(int(x.params.id)); if (!s) bad('수업을 찾을 수 없습니다.', 404); return s; };
    const needMaterial = (x) => {

    const routes = [];
    function route(method, path, roles, fn) {
      const keys = [];
      const re = new RegExp('^' + path.replace(/:[a-z_]+/g, (m) => { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
      routes.push({ method, re, keys, roles, fn });
    }
    function authUser(token) {
      if (!token) return null;
      const p = auth.verify(token);
      if (!p || !p.uid) return null;
      const u = U.get(p.uid);
      if (!u || u.status !== 'active') return null;
      if ((u.token_version || 0) !== (p.tv || 0)) return null;
      return u;
    }
    function handle(method, path, req) {
      req = req || {};
      memo = { c: new Map(), u: new Map(), x: new Map(), s: null };
      try {
        for (const r of routes) {
          if (r.method !== method) continue;
          const m = r.re.exec(path);
          if (!m) continue;
          const params = {};
          r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
          let user = null;
          if (r.roles) {
            user = authUser(req.token);
            if (!user) bad('로그인이 필요합니다.', 401);
            if (r.roles !== '*' && r.roles.indexOf(user.role) < 0) bad('이 작업을 할 권한이 없습니다.', 403);
          }
          const ctx = { user, params, query: req.query || {}, body: req.body || {}, file: req.file || null };
          let out;
          if (method === 'GET') out = r.fn(ctx);
          else db.tx(() => { out = r.fn(ctx); });
          return { status: 200, body: out === undefined ? { ok: true } : out };
        }
        bad('요청한 주소를 찾을 수 없습니다.', 404);
      } catch (e) {
        if (e instanceof HttpError) return { status: e.status, body: Object.assign({ error: e.message }, e.extra || {}) };
        if (deps.onError) deps.onError(e, method, path);
        return { status: 500, body: { error: '서버에서 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.' } };

/*
 * 미리보기용 백엔드. 서버 없이 브라우저 안에서 shared/api.js 를 그대로 돌린다.
 * 데이터는 메모리에만 있고, 새로고침하면 예시 데이터로 돌아간다. (진행 중인 수업이 항상 "지금"에 맞춰지도록)
 * scripts/build-preview.js 가 이 파일을 화면 코드와 함께 한 장의 HTML 로 묶는다.
 */
(function () {
  'use strict';
  const L = window.LMS;
  const platform = L.createDemoPlatform();
  const db = L.createMemDb(L.schema);
  const api = L.createApi({
    db, auth: platform.auth, files: platform.files, recs: platform.recs,
    env: { preview: true, realtime: false, testMedia: false, fileMaxMb: 20, version: 'preview', translate: false, langCodes: L.langs.LANGS.map((l) => l.code), translateModels: L.langs.MODELS.map((m) => m.id) },
    onError: (e) => console.error(e)
  });
  const seeded = L.seedDemo({ db, auth: platform.auth, files: platform.files, makePdf: L.makePdf, password: 'preview', sampleRecordings: true });
  const split = (p) => {
    const i = p.indexOf('?');
    if (i < 0) return [p, {}];
    const q = {};
    new URLSearchParams(p.slice(i + 1)).forEach((v, k) => { q[k] = v; });
    return [p.slice(0, i), q];
  };
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));

  window.LMS_DEMO = {
    async call(method, path, o) {
      await pause(40);
      const parts = split(path);
      return api.handle(method, parts[0], { token: o.token, body: o.body, query: parts[1] });
    },
    async upload(path, fields, file, token) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const f = platform.files.put(file.name, file.type, bytes);
      const out = api.handle('POST', path, { token, body: fields, file: { key: f.key, name: file.name, mime: file.type, size: f.size } });
      if (out.status >= 400) platform.files.remove(f.key);
      return out;
    },
    bytes: (url) => platform.files.bytes(url),
    // 수업 녹화: 강의실에서 녹화한 영상을 메모리에 두었다가 다시보기에서 꺼낸다. 예시 데이터의 녹화에는 영상이 없다.
    recPut: (id, blob) => platform.recs.put(id, blob),
    recBlob: (url) => platform.recs.get(url),
    async loginAs(role) {
      return api.handle('POST', '/auth/login', { body: { email: seeded.accounts[role] || seeded.accounts.admin, password: 'preview' } }).body;
    }
  };
})();

    md: (iso) => { const d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate(); },
    ymd: (iso) => { const d = new Date(iso); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()); },
    dayKey: (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
    monthKey: (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1),
    dayDiff: (iso) => { const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(iso); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 86400000); },

    secs: (s) => fmt.mins(Math.round((s || 0) / 60)),
    ago: (iso) => {
      if (!iso) return '-';

    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    send: '<path d="M4 12 20 4l-6 16-3-7z"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    reply: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v4"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
    alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
    lang: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    rec: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/>',
    stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/>'
  };
  const icon = (name, size) => raw('<svg class="ic" viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>');

  // ---------------------------------------------------------------- 저장소 (막혀 있어도 화면은 동작해야 한다)
  const TOKEN_KEY = 'bl_lms_token';
  const mem = {};
  const store = {
    get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k) || mem[k] || null; } catch (e) { return mem[k] || null; } },
    set(k, v, keep) { mem[k] = v; try { (keep ? localStorage : sessionStorage).setItem(k, v); (keep ? sessionStorage : localStorage).removeItem(k); } catch (e) { /* 저장소 차단 */ } },
    clear(k) { delete mem[k]; try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) { /* 저장소 차단 */ } },
    kept(k) { try { return localStorage.getItem(k) != null; } catch (e) { return false; } }
  };

  // ---------------------------------------------------------------- API
  function ApiError(status, body) { this.status = status; this.body = body || {}; this.message = (body && body.error) || '요청을 처리하지 못했습니다.'; }
  const API = {
    token: null,
    async call(method, path, body) {
      let out;
      if (DEMO()) out = await DEMO().call(method, path, { token: API.token, body });
      else {
        let res;
        try {
          res = await fetch('/api' + path, {
            method,
            headers: Object.assign({ 'Content-Type': 'application/json' }, API.token ? { Authorization: 'Bearer ' + API.token } : {}),
            body: method === 'GET' ? undefined : JSON.stringify(body || {})
          });
        } catch (e) { throw new ApiError(0, { error: '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.' }); }
        let data = {};
        try { data = await res.json(); } catch (e) { /* 본문 없음 */ }
        out = { status: res.status, body: data };
      }
      if (out.status === 401 && path !== '/auth/login' && App.state.user) App.session.expired();
      if (out.status >= 400) throw new ApiError(out.status, out.body);
      return out.body;
    },
    get: (p) => API.call('GET', p),
    post: (p, b) => API.call('POST', p, b),
    patch: (p, b) => API.call('PATCH', p, b),
    put: (p, b) => API.call('PUT', p, b),
    del: (p) => API.call('DELETE', p),
    // 파일 올리기. 진행률을 0~1 로 알려준다.
    upload(path, fields, file, onProgress) {
      if (DEMO()) return DEMO().upload(path, fields, file, API.token).then((out) => { if (out.status >= 400) throw new ApiError(out.status, out.body); return out.body; });
      return new Promise((resolve, reject) => {
        const fd = new FormData();
        Object.keys(fields).forEach((k) => fd.append(k, fields[k] == null ? '' : String(fields[k])));
        fd.append('file', file, file.name);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api' + path);
        if (API.token) xhr.setRequestHeader('Authorization', 'Bearer ' + API.token);
        xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
        xhr.onerror = () => reject(new ApiError(0, { error: '업로드 중 연결이 끊겼습니다. 다시 시도해 주세요.' }));
        xhr.onload = () => {
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch (e) { /* 본문 없음 */ }
          if (xhr.status >= 400) reject(new ApiError(xhr.status, data)); else resolve(data);
        };
        xhr.send(fd);
      });
    }
  };

  // 열람권 주소로 파일 내용을 가져온다. 미리보기에서는 메모리에서 바로 꺼낸다.
  const Files = {
    async bytes(url) {
      if (DEMO() && /^demo-file:/.test(url)) return DEMO().bytes(url);
      const res = await fetch(url);
      if (!res.ok) throw new ApiError(res.status, { error: '파일을 불러오지 못했습니다. 화면을 새로고침한 뒤 다시 열어 주세요.' });
      return new Uint8Array(await res.arrayBuffer());
    },
    async src(url, mime) {
      if (DEMO() && /^demo-file:/.test(url)) return URL.createObjectURL(new Blob([DEMO().bytes(url)], { type: mime || 'application/octet-stream' }));
      return url;
    },
    async download(url, name) {
      if (DEMO()) { toast('미리보기 화면에서는 파일 저장이 막혀 있습니다. 서버에 배포한 뒤에는 바로 내려받습니다.', 'info'); return; }
      const a = document.createElement('a');
      a.href = url; a.download = name || ''; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
  };

  // ---------------------------------------------------------------- 로그인 상태
  App.session = {
    async restore() {
      const t = store.get(TOKEN_KEY);
      if (!t) return false;
      API.token = t;
      try {
        const r = await API.get('/auth/me');
        App.state.user = r.user; App.state.config = r.config;
        return true;
      } catch (e) {
        if (e.status === 401) { store.clear(TOKEN_KEY); API.token = null; return false; }
        throw e;
      }
    },
    start(r, keep) {
      // keep 을 주지 않으면 지금 저장 방식(이 기기에 유지 / 이 탭에서만)을 그대로 따른다
      API.token = r.token; store.set(TOKEN_KEY, r.token, keep === undefined ? store.kept(TOKEN_KEY) : !!keep);
      App.state.user = r.user; if (r.config) App.state.config = r.config;
    },
    end() { API.token = null; store.clear(TOKEN_KEY); App.state.user = null; },
    expired() {
      if (App.session._expiring) return;
      App.session._expiring = true;
      setTimeout(() => { App.session._expiring = false; }, 3000);
      // 수업 중에는 화면을 강제로 닫지 않는다. 영상 연결은 참가자끼리 직접 이어져 있다.
      if (/^\/room\//.test(App.state.route.path)) { toast('로그인이 만료되었습니다. 수업이 끝난 뒤 다시 로그인해 주세요.', 'bad', 8000); return; }
      App.session.end();
      toast('로그인이 만료되었습니다. 다시 로그인해 주세요.', 'info');
      App.render();
    }
  };

  // ---------------------------------------------------------------- 처리기 등록·이벤트 위임
  const handlers = {};
  const on = (name, fn) => { handlers[name] = fn; };
  function formData(form) {
    const out = {};
    $$('input, select, textarea', form).forEach((el) => {
      if (!el.name || el.disabled) return;
      if (el.type === 'checkbox') {
        if (/\[\]$/.test(el.name)) { const k = el.name.slice(0, -2); out[k] = out[k] || []; if (el.checked) out[k].push(el.value); }
        else out[el.name] = el.checked ? 1 : 0;
      } else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else if (el.type === 'file') out[el.name] = el.files && el.files[0] ? el.files[0] : null;
      else out[el.name] = el.value;
    });
    return out;
  }
  function run(name, arg, el, ev, busyEl) {
    const fn = handlers[name];
    if (!fn) { console.error('처리기가 등록되지 않았습니다:', name); return; }
    let p;
    try { p = fn(arg, el, ev); } catch (e) { fail(e); return; }
    if (p && typeof p.then === 'function') {
      const b = busyEl || el;
      if (b && 'disabled' in b) { b.disabled = true; b.classList.add('is-busy'); }
      p.catch(fail).then(() => { if (b && 'disabled' in b && b.isConnected) { b.disabled = false; b.classList.remove('is-busy'); } });
    }
  }
  function fail(e) {
    if (e && e.message && e.status !== undefined) toast(e.message, 'bad');
    else { console.error(e); toast('처리 중 문제가 발생했습니다. 다시 시도해 주세요.', 'bad'); }
  }
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('a[href^="#/"]');
    if (nav && !e.metaKey && !e.ctrlKey && !nav.hasAttribute('data-act')) { e.preventDefault(); App.go(nav.getAttribute('href').slice(1)); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    run(el.dataset.act, el.dataset, el, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    run(f.dataset.form, formData(f), f, e, $('button[type="submit"]', f));
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (el) run(el.dataset.change, el.dataset, el, e, {});
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const top = layers[layers.length - 1];
    if (top && !top.sticky) top.close();
  });

  // ---------------------------------------------------------------- 알림·모달·서랍
  const layers = [];
  function layerRoot() { return $('#layer'); }
  function toast(msg, kind, ms) {
    let box = $('#toasts');
    if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; box.setAttribute('aria-live', 'polite'); layerRoot().appendChild(box); }
    const el = document.createElement('div');
    el.className = 'toast toast-' + (kind || 'ok');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.classList.add('is-out'); setTimeout(() => el.remove(), 250); }, ms || (kind === 'bad' ? 5000 : 2800));
  }
  // modal({ title, body, foot, wide, side }) -> { el, close }.  side: 'right' 이면 서랍으로 열린다.
  function modal(o) {
    const wrap = document.createElement('div');
    wrap.className = 'overlay' + (o.side ? ' overlay-side' : '');
    wrap.innerHTML = html`
      <div class="${o.side ? 'drawer' : 'modal'}${o.wide ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-label="${o.title || ''}">
        <header class="modal-h"><h2>${o.title || ''}</h2><button class="icon-btn" type="button" data-act="layer.close" aria-label="닫기">${icon('x')}</button></header>
        <div class="modal-b">${o.body || ''}</div>
        ${o.foot ? html`<footer class="modal-f">${o.foot}</footer>` : ''}
      </div>`.s;
    const layer = {
      el: wrap, sticky: !!o.sticky,
      close(result) {
        const i = layers.indexOf(layer);
        if (i < 0) return;
        layers.splice(i, 1);
        wrap.remove();
        if (o.onClose) o.onClose(result);
      }
    };
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap && !o.sticky) layer.close(); });
    layers.push(layer);
    layerRoot().appendChild(wrap);
    const first = $('[autofocus], input:not([type=hidden]), textarea, select', wrap);
    if (first && !o.noFocus) setTimeout(() => first.focus(), 30);
    return layer;
  }
  on('layer.close', (d, el) => { const w = el.closest('.overlay'); const l = layers.filter((x) => x.el === w)[0]; if (l) l.close(); });
  const closeLayers = () => { while (layers.length) layers[layers.length - 1].close(); };
  // 확인 창. 브라우저 기본 창 대신 쓴다. 약속(Promise)으로 예/아니오를 돌려준다.
  function ask(o) {
    return new Promise((resolve) => {
      let done = false;
      const m = modal({
        title: o.title || '확인',
        body: html`<p class="ask-msg">${o.message || ''}</p>${o.detail ? html`<p class="hint">${o.detail}</p>` : ''}`,
        foot: html`<button class="btn" type="button" data-act="layer.close">${o.no || '취소'}</button><button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" type="button" data-act="ask.yes" autofocus>${o.yes || '확인'}</button>`,
        onClose: () => { if (!done) resolve(false); }
      });
      m.el.addEventListener('click', (e) => { if (e.target.closest('[data-act="ask.yes"]')) { done = true; resolve(true); m.close(); } });
    });
  }
  on('ask.yes', () => {});

  // ---------------------------------------------------------------- 작은 화면 조각
  const chip = (text, kind) => html`<span class="chip${kind ? ' chip-' + kind : ''}">${text}</span>`;
  // 상태는 알약 모양 대신 글자로 적는다. 진행 중만 빨간 네모와 함께 굵게.
  const statusChip = (s) => html`<span class="st${s.status === 'live' ? ' st-live' : s.status === 'ended' ? ' st-off' : s.status === 'canceled' ? ' st-cancel' : ''}">${LABEL.status[s.status]}</span>`;
  // 출석은 출석부 기호와 함께 적는다.
  const attChip = (st) => (st ? html`<span class="am am-${st}"><i aria-hidden="true">${LABEL.mark[st]}</i>${LABEL.att[st]}</span>` : html`<span class="am am-none">기록 없음</span>`);
  const dot = (color) => html`<i class="cdot c-${color || 'navy'}"></i>`;
  const avatar = (name, cls) => html`<span class="avatar ${cls || ''}" aria-hidden="true">${String(name || '?').slice(0, 1)}</span>`;
  const empty = (ic, title, desc, action) => html`<div class="empty"><p class="empty-t">${title}</p>${desc ? html`<p class="empty-d">${desc}</p>` : ''}${action || ''}</div>`;
  const skeleton = (n) => html`<div class="skel" aria-hidden="true">${Array.from({ length: n || 4 }, (_, i) => html`<div class="skel-l" style="width:${[92, 78, 85, 60, 70][i % 5]}%"></div>`)}</div>`;
  const field = (label, control, hint) => html`<label class="field"><span class="field-l">${label}</span>${control}${hint ? html`<span class="hint">${hint}</span>` : ''}</label>`;
  const opt = (value, label, cur) => html`<option value="${value}"${String(value) === String(cur == null ? '' : cur) ? raw(' selected') : ''}>${label}</option>`;
  const bar = (pct, cls) => html`<span class="bar ${cls || ''}"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%"></i></span>`;
  const isStaff = () => { const u = App.state.user; return !!u && u.role !== 'student'; };
  const isAdmin = () => !!App.state.user && App.state.user.role === 'admin';

  // 입장 버튼. 서버가 알려 준 join 상태만 따른다.
  function joinBtn(s, small, always) {
    const cls = 'btn btn-go' + (small ? ' btn-sm' : '');
    if (s.join && s.join.ok) {
      // 먼 일정까지 버튼을 달면 목록이 버튼으로 가득 찬다. 회차 상세(always)에서는 언제나 보인다.
      if (!always && s.status !== 'live' && isStaff() && Date.parse(s.starts_at) - Date.now() > 60 * 60000) return '';
      const label = s.status === 'live' ? '입장' : s.can_manage ? '수업 시작' : '대기실 입장';
      return html`<a class="${cls}" href="#/room/${s.id}">${label}</a>`;
    }
    // 입장 가능 시각 안내는 오늘 수업에만 붙인다. 다른 날 수업에 시각만 보이면 오해하기 쉽다.
    if (s.status === 'scheduled' && s.join && s.join.opens_at && fmt.dayDiff(s.join.opens_at) === 0) return html`<span class="join-wait">${fmt.time(s.join.opens_at)}부터 입장</span>`;
    return '';
  }

  // ---------------------------------------------------------------- 화면 이동
  const routes = [];
  const leaveFns = [];
  const inApp = [];           // 미리보기에서는 주소(hash)를 쓰지 않고 내부 이동 기록을 쓴다
  App.route = (pattern, view, opts) => {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[a-z]+/g, (m) => { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    routes.push({ re, keys, view, opts: opts || {} });
  };
  const usesHash = () => !DEMO();
  function currentPath() {
    if (usesHash()) return (location.hash || '#/').slice(1) || '/';
    return inApp.length ? inApp[inApp.length - 1] : '/';
  }
  App.go = (path, replace) => {
    if (usesHash()) {
      if (replace) history.replaceState(null, '', '#' + path); else if (location.hash === '#' + path) { App.render(); return; } else { location.hash = path; return; }
      App.render();
    } else {
      if (replace && inApp.length) inApp[inApp.length - 1] = path; else inApp.push(path);
      if (inApp.length > 50) inApp.shift();
      App.render();
    }
  };
  App.back = (fallback) => {
    if (usesHash()) { if (history.length > 1) history.back(); else App.go(fallback || '/'); return; }
    if (inApp.length > 1) { inApp.pop(); App.render(); } else App.go(fallback || '/', true);
  };
  App.onLeave = (fn) => leaveFns.push(fn);
  App.alive = (token) => token === App.seq;
  window.addEventListener('hashchange', () => { if (usesHash()) App.render(); });
  on('nav.back', (d) => App.back(d.to));

  App.render = async function (keepScroll) {
    while (leaveFns.length) { try { leaveFns.pop()(); } catch (e) { console.error(e); } }
    closeLayers();
    const full = currentPath();
    const qi = full.indexOf('?');
    const path = qi < 0 ? full : full.slice(0, qi);
    const query = {};
    if (qi >= 0) new URLSearchParams(full.slice(qi + 1)).forEach((v, k) => { query[k] = v; });
    const token = ++App.seq;
    const user = App.state.user;
    let route = null, params = {};
    if (!user) route = routes.filter((r) => r.opts.login)[0];
    else if (user.must_change_pw && !DEMO()) route = routes.filter((r) => r.opts.firstPw)[0];
    else {
      for (const r of routes) {
        const m = r.re.exec(path);
        if (!m || r.opts.login || r.opts.firstPw) continue;
        route = r; r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
        break;
      }
    }
    App.state.route = { path, params, query };
    const bare = !route || !!route.opts.bare;
    document.body.dataset.layout = bare ? 'bare' : 'app';
    App.shell(bare);
    const el = bare ? $('#bare') : $('#view');
    const prev = keepScroll ? el.scrollTop : 0;
    if (!route) { setHTML(el, empty('alert', '없는 화면입니다', '주소가 바뀌었거나 삭제된 항목입니다.', html`<a class="btn" href="#/">홈으로</a>`)); return; }
    if (route.opts.roles && route.opts.roles.indexOf(user.role) < 0) {
      App.header({ title: '권한 없음' });
      setHTML(el, empty('alert', '이 화면을 볼 권한이 없습니다', '필요하면 관리자에게 요청해 주세요.', html`<a class="btn" href="#/">홈으로</a>`));
      return;
    }
    if (!keepScroll) setHTML(el, html`<div class="view-in">${skeleton(6)}</div>`);
    try {
      await route.view({ el, params, query, token, alive: () => token === App.seq });
      if (token === App.seq) el.scrollTop = prev;
    } catch (e) {
      if (token !== App.seq) return;
      if (!(e instanceof ApiError)) console.error(e);
      setHTML(el, html`<div class="view-in">${empty('alert', e.status === 404 ? '찾을 수 없습니다' : e.status === 403 ? '권한이 없습니다' : '화면을 불러오지 못했습니다', e.message || '', html`<button class="btn" type="button" data-act="app.reload">다시 시도</button>`)}</div>`);
    }
  };
  on('app.reload', () => App.render());
  App.refresh = () => App.render(true);

  // ---------------------------------------------------------------- 뼈대 (내비게이션·머리줄)
  const NAV = {
